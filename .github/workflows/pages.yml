name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Vite+ sets up Node, pnpm and the dependency cache
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "22"
          cache: true
      - run: vp install
      - run: vp check
      - run: vp test
      - run: vp run build
      # phone and tablet layout check (tests/mobile-check.mjs)
      # Playwright's own Chromium, without --with-deps: the runner already has Chrome's system libraries, and the
      # apt step pulls fonts from a slow mirror that has stalled CI for many minutes
      - run: vp exec playwright install chromium
        timeout-minutes: 5
      - run: node tests/mobile-check.mjs dist/stack-planner.html
        timeout-minutes: 5
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "22"
          cache: true
      - run: vp install
      - run: vp run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
