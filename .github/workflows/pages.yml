name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: sh tools/build.sh pages
      # phone and tablet layout check (tests/mobile-check.mjs)
      # uses the runner's preinstalled Google Chrome: installing Playwright's browser pulls system packages
      # from a slow apt mirror and has stalled CI for many minutes
      - run: npm i --no-save playwright@1.56.1
      - run: PW_CHROMIUM="$(command -v google-chrome || command -v google-chrome-stable)" node tests/mobile-check.mjs dist/stack-planner.html
        timeout-minutes: 5
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sh tools/build.sh pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
