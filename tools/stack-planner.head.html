<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker Planner</title>
<style>
  :root { --ground: #f5f5f4; --ink: #1c1917; }
  body { margin: 0; background: var(--ground); color: var(--ink); }
  #root { min-height: 100%; }
  /* pan-y lets a vertical swipe scroll the page; anything else rotates */
  canvas { display: block; touch-action: pan-y; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  /* touch screens: 40 px minimum tap targets */
  @media (pointer: coarse) {
    button, select, nav a { min-height: 40px; }
    nav a { display: inline-flex; align-items: center; }
    /* a 28 px thumb on a thin track: easier to grab than the default, which iOS requires you to hit */
    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; height: 36px; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #d6d3d1; border-radius: 2px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -12px; border-radius: 50%; background: #1c1917; border: 3px solid #fff; box-shadow: 0 0 0 1px #a8a29e; }
    input[type=range]::-moz-range-track { height: 4px; background: #d6d3d1; border-radius: 2px; }
    input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #1c1917; border: 3px solid #fff; box-shadow: 0 0 0 1px #a8a29e; }
    .swatch { width: 40px !important; height: 40px !important; }
  }
</style>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.140.0/three.min.js"></script>
