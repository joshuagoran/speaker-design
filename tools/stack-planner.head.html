<title>Speaker Planner</title>
<style>
  :root { --ground: #f5f5f4; --ink: #1c1917; }
  body { margin: 0; background: var(--ground); color: var(--ink); }
  #root { min-height: 100%; }
  /* pan-y lets a vertical swipe scroll the page; anything else rotates */
  canvas { display: block; touch-action: pan-y; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  /* touch screens: 40 px minimum tap targets */
  @media (pointer: coarse) {
    button, select, nav a { min-height: 40px; }
    nav a { display: inline-flex; align-items: center; }
    /* a 28 px thumb on a thin track: easier to grab than the default, which iOS requires you to hit */
