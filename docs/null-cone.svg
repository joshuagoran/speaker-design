<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="lobe" x1="0" x2="1">
    <stop offset="0" stop-color="#4a8fb0" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#4a8fb0" stop-opacity="0.06"/>
  </linearGradient>
  <linearGradient id="lobeB" x1="0" x2="1">
    <stop offset="0" stop-color="#4a8fb0" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#4a8fb0" stop-opacity="0.06"/>
  </linearGradient>
  <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#8a8580"/>
  </marker>
</defs>
<rect width="1000" height="560" fill="#f4f2ee"/>

<text x="34" y="36" font-size="17" font-weight="700" fill="#2b2725">Where the null goes: it follows the line joining the two drivers</text>
<text x="34" y="58" font-size="13" fill="#6b6560">A460G2 horn + 12" mid, 15.4" apart, crossover 950 Hz. First null at 28° — measured only in the plane containing both drivers.</text>

<!-- ============ PANEL A : horn above, side elevation ============ -->
<g transform="translate(34,84)">
  <rect x="0" y="0" width="450" height="440" fill="#ffffff" stroke="#ded9d2"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#2b2725">Horn ABOVE the 12"</text>
  <text x="16" y="45" font-size="12" fill="#6b6560">side view · null cone opens up and down</text>

  <!-- plot area: x 70..430 = 0..18 ft (20 px/ft) ; y centre 250, ±9 ft -->
  <g transform="translate(70,250)">
    <!-- main lobe wedge -->
    <path d="M0,0 L360,-191 L360,191 z" fill="url(#lobe)"/>
    <!-- null rays -->
    <line x1="0" y1="0" x2="360" y2="-191" stroke="#b23a2f" stroke-width="2" stroke-dasharray="7 5"/>
    <line x1="0" y1="0" x2="360" y2="191" stroke="#b23a2f" stroke-width="2" stroke-dasharray="7 5"/>
    <!-- axis -->
    <line x1="0" y1="0" x2="370" y2="0" stroke="#8a8580" stroke-width="1.2" marker-end="url(#ar)"/>
    <!-- listener band: ±1.5 ft = ±30 px -->
    <rect x="30" y="-30" width="330" height="60" fill="#4a5d4e" fill-opacity="0.20" stroke="#4a5d4e" stroke-width="1.2"/>
    <text x="196" y="-38" font-size="11.5" font-weight="700" fill="#39472f" text-anchor="middle">ears live in this strip  (±1.5 ft)</text>
    <!-- little heads -->
    <g fill="#4a5d4e">
      <circle cx="120" cy="6" r="5"/><circle cx="190" cy="-6" r="5"/><circle cx="258" cy="4" r="5"/><circle cx="320" cy="-4" r="5"/>
    </g>
    <!-- angle mark -->
    <path d="M62,0 A62,62 0 0,0 54.7,-29" fill="none" stroke="#b23a2f" stroke-width="1.2"/>
    <text x="72" y="-16" font-size="11.5" fill="#b23a2f" font-weight="700">28°</text>
    <!-- null labels -->
    <text x="364" y="-196" font-size="11.5" fill="#b23a2f" font-weight="700" text-anchor="end">null (10.6 ft up at 20 ft)</text>
    <text x="364" y="207" font-size="11.5" fill="#b23a2f" font-weight="700" text-anchor="end">null (10.6 ft down)</text>
    <!-- floor -->
    <line x1="-46" y1="150" x2="370" y2="150" stroke="#c9c3ba" stroke-width="1.5"/>
    <text x="374" y="147" font-size="10.5" fill="#9b948c">floor</text>
    <!-- the box -->
    <g transform="translate(-46,0)">
      <rect x="0" y="-52" width="40" height="40" fill="#e8e3db" stroke="#2b2725" stroke-width="1.4"/>
      <path d="M8,-45 L32,-45 L26,-32 L14,-32 z" fill="#2b2725" opacity="0.75"/>
      <text x="46" y="-36" font-size="10.5" fill="#2b2725" font-weight="700">horn</text>
      <rect x="0" y="-12" width="40" height="40" fill="#e8e3db" stroke="#2b2725" stroke-width="1.4"/>
      <circle cx="20" cy="8" r="13" fill="none" stroke="#2b2725" stroke-width="1.4"/><circle cx="20" cy="8" r="4" fill="#2b2725"/>
      <text x="46" y="12" font-size="10.5" fill="#2b2725" font-weight="700">12"</text>
      <rect x="0" y="28" width="40" height="122" fill="#efeae2" stroke="#c9c3ba" stroke-width="1.2"/>
      <text x="46" y="96" font-size="10.5" fill="#9b948c">sub</text>
    </g>
  </g>
  <text x="16" y="424" font-size="12" font-weight="700" fill="#39472f">Nulls miss everyone. This is the orientation you want.</text>
</g>

<!-- ============ PANEL B : horn beside, plan view ============ -->
<g transform="translate(516,84)">
  <rect x="0" y="0" width="450" height="440" fill="#ffffff" stroke="#ded9d2"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#2b2725">Horn BESIDE the 12"</text>
  <text x="16" y="45" font-size="12" fill="#6b6560">top view · null cone opens left and right</text>

  <g transform="translate(70,250)">
    <path d="M0,0 L360,-191 L360,191 z" fill="url(#lobeB)"/>
    <line x1="0" y1="0" x2="360" y2="-191" stroke="#b23a2f" stroke-width="2" stroke-dasharray="7 5"/>
    <line x1="0" y1="0" x2="360" y2="191" stroke="#b23a2f" stroke-width="2" stroke-dasharray="7 5"/>
    <line x1="0" y1="0" x2="370" y2="0" stroke="#8a8580" stroke-width="1.2" marker-end="url(#ar)"/>
    <!-- dance floor: the whole ±9 ft -->
    <rect x="30" y="-186" width="330" height="372" fill="#4a5d4e" fill-opacity="0.13" stroke="#4a5d4e" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="196" y="-196" font-size="11.5" font-weight="700" fill="#39472f" text-anchor="middle">dance floor spreads this way (±12–18 ft)</text>
    <g fill="#4a5d4e">
      <circle cx="90" cy="-60" r="5"/><circle cx="140" cy="40" r="5"/><circle cx="150" cy="-110" r="5"/>
      <circle cx="210" cy="-20" r="5"/><circle cx="230" cy="100" r="5"/><circle cx="250" cy="-140" r="5"/>
      <circle cx="300" cy="60" r="5"/><circle cx="315" cy="-90" r="5"/><circle cx="340" cy="150" r="5"/>
      <circle cx="180" cy="130" r="5"/><circle cx="275" cy="-40" r="5"/><circle cx="120" cy="95" r="5"/>
    </g>
    <!-- people sitting ON the null -->
    <g fill="#b23a2f">
      <circle cx="160" cy="-85" r="6"/><circle cx="260" cy="-138" r="6"/><circle cx="200" cy="106" r="6"/><circle cx="310" cy="165" r="6"/>
    </g>
    <path d="M62,0 A62,62 0 0,0 54.7,-29" fill="none" stroke="#b23a2f" stroke-width="1.2"/>
    <text x="72" y="-16" font-size="11.5" fill="#b23a2f" font-weight="700">28°</text>
    <text x="364" y="-196" font-size="11.5" fill="#b23a2f" font-weight="700" text-anchor="end">null cuts across the crowd</text>
    <!-- the box, from above -->
    <g transform="translate(-46,0)">
      <rect x="0" y="-40" width="40" height="80" fill="#e8e3db" stroke="#2b2725" stroke-width="1.4"/>
      <path d="M33,-34 L33,-10 L20,-16 L20,-28 z" fill="#2b2725" opacity="0.75"/>
      <text x="-6" y="-46" font-size="10.5" fill="#2b2725" font-weight="700" text-anchor="middle">horn</text>
      <circle cx="20" cy="20" r="13" fill="none" stroke="#2b2725" stroke-width="1.4"/><circle cx="20" cy="20" r="4" fill="#2b2725"/>
      <text x="-6" y="56" font-size="10.5" fill="#2b2725" font-weight="700" text-anchor="middle">12"</text>
    </g>
  </g>
  <text x="16" y="424" font-size="12" font-weight="700" fill="#8f2f26">Same null, now pointed at the audience.</text>
</g>

<text x="34" y="548" font-size="11.5" fill="#8a8580">Spacing is 15.4" either way — half the 18.1" horn plus half the 12.6" frame — so the lobe is identical. Only its orientation changes.</text>
</svg>
