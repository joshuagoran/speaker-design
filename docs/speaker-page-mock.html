<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speaker Page Mock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600;700&display=swap"
    />
    <style>
      /* A working mock of the Speaker page plan (docs/speaker-page-plan.md). Fake numbers, no acoustics.
         The colors are the app's palette tokens (src/styles/palette.ts), light and dark. */
      :root {
        --ink: #111111;
        --page: #ffffff;
        --panel: #ffffff;
        --muted: #595959;
        --faint: #8c8c8c;
        --edge: #e6e6e6;
        --magenta: #e5007e;
        --cyan: #0077b8;
        --yellow: #ffd400;
        --sub-tint: #fff3b0;
        --mid-tint: #cce6f4;
        --shadow: #111111;
        --green-tint: #ecf8f0;
        --green-edge: #8fcf9f;
        --green-text: #1a7f37;
        --orange-tint: #fff3e3;
        --orange-edge: #f2b26b;
        --orange-text: #a85400;
        --red-tint: #fdeeee;
        --red-edge: #ee9a9a;
        --red-text: #c81e1e;
        /* the 3D view's stage (STAGE in palette.ts) */
        --stage: #f4f4f4;
        --stage-grid: #dddddd;
        --soft: rgba(89, 89, 89, 0.5);
        --font: "Inconsolata", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        --set-w: 40%;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ink: #e8e8e6;
          --page: #141516;
          --panel: #1b1d1f;
          --muted: #a3a3a3;
          --faint: #707070;
          --edge: #33373b;
          --magenta: #ff4fae;
          --cyan: #45b6f2;
          --yellow: #ffd84d;
          --sub-tint: #3a3410;
          --mid-tint: #12313f;
          --shadow: #000000;
          --green-tint: #10291a;
          --green-edge: #2f6e43;
          --green-text: #6fd98c;
          --orange-tint: #2e2110;
          --orange-edge: #8a5a1f;
          --orange-text: #ffb866;
          --red-tint: #2e1414;
          --red-edge: #7a2f2f;
          --red-text: #ff8a8a;
          --stage: #232528;
          --stage-grid: #3d4145;
          --soft: rgba(163, 163, 163, 0.5);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --ink: #e8e8e6;
        --page: #141516;
        --panel: #1b1d1f;
        --muted: #a3a3a3;
        --faint: #707070;
        --edge: #33373b;
        --magenta: #ff4fae;
        --cyan: #45b6f2;
        --yellow: #ffd84d;
        --sub-tint: #3a3410;
        --mid-tint: #12313f;
        --shadow: #000000;
        --green-tint: #10291a;
        --green-edge: #2f6e43;
        --green-text: #6fd98c;
        --orange-tint: #2e2110;
        --orange-edge: #8a5a1f;
        --orange-text: #ffb866;
        --red-tint: #2e1414;
        --red-edge: #7a2f2f;
        --red-text: #ff8a8a;
        --stage: #232528;
        --stage-grid: #3d4145;
        --soft: rgba(163, 163, 163, 0.5);
        color-scheme: dark;
      }
      @media (min-width: 1280px) {
        :root {
          --set-w: 26rem;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.4;
        display: flex;
        flex-direction: column;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      h2,
      h3,
      p,
      ul {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }

      /* the mock's own bar: tasks, pane heights, folds, theme (not part of the page) */
      #mockbar {
        border-bottom: 2px solid var(--yellow);
        background: var(--panel);
        padding: 8px 32px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      #mockbar .line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 14px;
      }
      #mockbar b.title {
        font-size: 14px;
      }
      #mockbar .tasks {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #mockbar .tasks label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        cursor: pointer;
      }
      #mockbar .tasks input {
        accent-color: var(--cyan);
        margin: 0;
      }
      #mockbar .tasks .done span {
        color: var(--muted);
        text-decoration: line-through;
      }
      .readout {
        font-variant-numeric: tabular-nums;
      }
      .readout b {
        font-weight: 700;
      }
      .readout .ok {
        color: var(--green-text);
      }

      /* the page: results pane, divider, settings column (SettingsLayout) */
      #page {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 24px var(--set-w);
        grid-template-rows: minmax(0, 1fr);
        padding: 12px 32px 0;
      }
      .pane {
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
        min-height: 0;
      }
      #results {
        margin-left: -4px;
        padding: 0 8px 64px 4px;
      }
      #resultsInner {
        container: res / inline-size;
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-width: 90rem;
      }
      .divider {
        display: flex;
        justify-content: center;
        margin-bottom: 16px;
      }
      .divider::before {
        content: "";
        width: 1px;
        background: var(--edge);
      }
      #settings {
        align-self: start;
        display: flex;
        flex-direction: column;
        max-height: calc(100% - 16px);
        border: 1px solid var(--edge);
        border-radius: 6px;
        min-height: 0;
        min-width: 0;
      }
      .sethead {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
      }
      .sethead h2 {
        font-size: 20px;
      }
      #settingsBody {
        padding: 0 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      @media (max-width: 767px) {
        html,
        body {
          height: auto;
        }
        body {
          display: block;
        }
        #mockbar {
          padding: 8px 16px;
        }
        #page {
          display: flex;
          flex-direction: column;
          gap: 32px;
          padding: 12px 16px 64px;
        }
        .pane {
          overflow: visible;
        }
        #results {
          margin: 0;
          padding: 0;
        }
        .divider {
          display: none;
        }
        #settings {
          align-self: stretch;
          border: 0;
          max-height: none;
        }
        .sethead,
        #settingsBody {
          padding-left: 0;
          padding-right: 0;
        }
      }

      /* shared controls (src/components/ui) */
      .btn {
        font-size: 14px;
        padding: 8px 12px;
        border: 1px solid var(--edge);
        border-radius: 4px;
        background: var(--panel);
        cursor: pointer;
        transition:
          color 150ms,
          background-color 150ms,
          border-color 150ms;
      }
      .btn:hover {
        border-color: var(--muted);
      }
      .btn.xs {
        padding: 4px 10px;
        font-size: 12px;
      }
      .btn.nowrap {
        white-space: nowrap;
      }
      .btn.primary {
        background: var(--cyan);
        border-color: var(--cyan);
        color: var(--page);
        font-weight: 600;
      }
      .btn.primary:hover {
        border-color: var(--ink);
      }
      .btn[aria-pressed="true"],
      .ibtn[aria-pressed="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--page);
      }
      .btn:disabled {
        background: var(--edge);
        border-color: var(--edge);
        color: var(--muted);
        cursor: not-allowed;
      }
      .ibtn {
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--edge);
        border-radius: 4px;
        background: var(--panel);
        cursor: pointer;
        padding: 0;
      }
      .ibtn:hover {
        border-color: var(--muted);
      }
      .ibtn.sm {
        width: 30px;
        height: 30px;
      }
      .ibtn svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tg {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .lbl {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .lbl .live {
        color: var(--ink);
        font-weight: 600;
        white-space: nowrap;
      }
      input[type="number"],
      input[type="text"],
      select,
      textarea {
        width: 100%;
        height: 38px;
        padding: 8px 12px;
        font-size: 14px;
        border: 1px solid var(--edge);
        border-radius: 4px;
        background: var(--panel);
        transition: border-color 150ms;
      }
      select {
        padding: 8px 6px 8px 10px;
      }
      .cmp input,
      .cmp select {
        height: 30px;
        padding: 4px 6px;
      }
      .typerow {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 16px;
      }
      textarea {
        height: 76px;
        resize: vertical;
      }
      input:hover,
      select:hover,
      textarea:hover {
        border-color: var(--muted);
      }
      input[readonly] {
        color: var(--muted);
        cursor: default;
      }
      .term {
        border-bottom: 2px dotted var(--soft);
        cursor: help;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .card {
        border: 1px solid var(--edge);
        border-radius: 4px;
        background: var(--panel);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
        transition: border-color 150ms;
      }
      .card:focus-within {
        border-color: var(--muted);
      }
      .cardhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .cardhead h3 {
        font-size: 16px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .r2,
      .r3,
      .rmc,
      .frow,
      .goals {
        display: grid;
        gap: 12px;
        align-items: end;
      }
      .r2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .r3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .rmc {
        grid-template-columns: minmax(0, 1fr) 84px;
      }
      .frow {
        grid-template-columns: minmax(0, 1fr) 112px;
      }
      .frow > .wide {
        grid-column: span 2;
      }
      .goals {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .goals .lbl {
        white-space: nowrap;
      }
      .startrow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }
      .fold {
        font-size: 14px;
        border: 1px solid var(--edge);
        border-radius: 4px;
        padding: 8px 12px;
      }
      .fold > summary {
        cursor: pointer;
        color: var(--muted);
        padding: 4px 0;
      }
      .fold > summary:hover {
        color: var(--ink);
      }
      .fold > .stack {
        padding-top: 8px;
      }
      .sec h2 button {
        all: unset;
        box-sizing: border-box;
        width: 100%;
        min-height: 44px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        font-size: 20px;
        font-weight: 700;
      }
      .sec h2 button:focus-visible {
        outline: 2px solid var(--ink);
      }
      .sec .ft {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      /* the fold's summary wraps under its title, up to two lines */
      .sec .sum {
        font-size: 12px;
        line-height: 1.35;
        font-weight: 400;
        color: var(--muted);
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        margin-top: 2px;
      }
      .sec .sum[hidden] {
        display: none;
      }
      .sec .pm {
        color: var(--muted);
        font-size: 16px;
      }
      .sec h2 button:hover .pm {
        color: var(--ink);
      }
      .secbody {
        padding-top: 12px;
      }
      .drvbox {
        border: 1px solid var(--edge);
        border-radius: 4px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      /* a chamber's sub-section: a small heading over one or more inset boxes */
      .grp {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .grp > .grpbody {
        gap: 12px;
        padding: 8px;
      }
      .card[data-chamber] {
        padding: 10px 8px;
      }
      .grp > .subhead {
        color: var(--muted);
      }
      input:disabled,
      select:disabled {
        color: var(--muted);
        background: var(--page);
        opacity: 1;
        cursor: default;
      }
      input:disabled:hover,
      select:disabled:hover {
        border-color: var(--edge);
      }
      /* a box that folds to one summary line: chevron, title, summary, actions at the right */
      .fbox {
        border: 1px solid var(--edge);
        border-radius: 4px;
        padding: 4px 4px 4px 6px;
        display: flex;
        flex-direction: column;
        transition: border-color 150ms;
      }
      .fbox:focus-within {
        border-color: var(--muted);
      }
      .fhead {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
      }
      .fsum {
        all: unset;
        box-sizing: border-box;
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding: 4px 0;
        cursor: pointer;
      }
      .fsum:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .fsum .chev {
        flex: none;
        width: 14px;
        height: 14px;
        margin-top: 2px;
        fill: none;
        stroke: var(--muted);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 150ms;
      }
      .fsum[aria-expanded="true"] .chev {
        transform: rotate(90deg);
      }
      .fsum:hover .chev {
        stroke: var(--ink);
      }
      /* the line wraps to two lines at most */
      .fsum .ftext {
        min-width: 0;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        font-size: 14px;
        line-height: 1.35;
      }
      .fsum .ftitle {
        font-weight: 700;
        margin-right: 8px;
      }
      .fsum .fs {
        color: var(--muted);
        font-size: 13px;
      }
      .fsum .fs.main {
        color: var(--ink);
        font-size: 14px;
      }
      .fbody {
        gap: 12px;
        padding: 6px 4px 6px 0;
      }
      /* a filter that is off: its label and dropdown on one short row */
      .field.inline {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        align-items: center;
        gap: 12px;
      }
      .field.inline .lbl {
        margin: 0;
      }
      .field.inline select {
        height: 30px;
        padding: 4px 6px;
      }
      .subhead {
        font-size: 14px;
        font-weight: 700;
      }
      .swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 2px;
        border: 1px solid var(--edge);
        vertical-align: -1px;
        margin-right: 6px;
      }
      .tag {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        border: 1px dashed var(--faint);
        border-radius: 4px;
        padding: 1px 6px;
        vertical-align: 2px;
        margin-left: 8px;
      }
      .notice {
        font-size: 13px;
        padding: 8px 12px;
        border: 1px solid var(--orange-edge);
        background: var(--orange-tint);
        border-radius: 4px;
      }
      #tip {
        position: fixed;
        z-index: 50;
        max-width: 18rem;
        width: max-content;
        background: var(--ink);
        color: var(--page);
        font-size: 12px;
        line-height: 1.35;
        padding: 6px 8px;
        border-radius: 4px;
        pointer-events: none;
      }

      /* results */
      .sh {
        font-size: 20px;
        font-weight: 700;
      }
      .block {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      .saved {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .saved select {
        width: auto;
        min-width: 0;
        max-width: 100%;
        height: 32px;
        padding: 4px 8px;
      }
      .saved select.savedlist {
        min-width: 200px;
      }
      .saved input.savedname {
        flex: 1 1 180px;
        width: auto;
        min-width: 0;
        max-width: 280px;
        height: 32px;
        padding: 4px 8px;
      }
      .views {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }
      @container res (min-width: 640px) {
        .views {
          grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
        }
      }
      .vh {
        height: 280px;
      }
      @media (min-width: 768px) {
        .vh {
          height: clamp(300px, 46vh, 480px);
        }
      }
      .v3d {
        position: relative;
        background: var(--stage);
        border: 1px solid var(--edge);
        border-radius: 6px;
        overflow: hidden;
      }
      .v3d svg,
      .v2d svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .v3d .tools {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 4px;
      }
      .v2d {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
      }
      .v2d .svgwrap {
        flex: 1;
        min-height: 0;
      }
      .v2d svg {
        touch-action: none;
        user-select: none;
      }
      .v2dhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      [data-drv] {
        cursor: grab;
      }
      .dragging [data-drv] {
        cursor: grabbing;
      }
      .foldgrid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }
      @container res (min-width: 700px) {
        .foldgrid {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
      }
      .foldgrid svg {
        width: 100%;
        height: 260px;
        display: block;
      }
      .foldgrid text {
        fill: var(--muted);
        font-size: 12px;
        font-family: var(--font);
      }
      .charts {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px 16px;
        align-items: start;
      }
      @container res (min-width: 858px) {
        .charts {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
      }
      .chart svg {
        width: 100%;
        height: auto;
        display: block;
      }
      /* the Response and Maximum output charts: a fixed pixel height at any width, as in the app */
      .chart.fixed svg {
        height: 280px;
      }
      .chart text {
        fill: var(--muted);
        font-size: 11px;
        font-family: var(--font);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .legend i {
        display: inline-block;
        width: 18px;
        height: 0;
        border-top: 3px solid;
        vertical-align: 3px;
        margin-right: 4px;
      }
      .tiles {
        display: grid;
        gap: 1px;
        border: 1px solid var(--edge);
        background: var(--edge);
        border-radius: 6px;
        overflow: hidden;
        grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
      }
      .tile {
        background: var(--page);
        padding: 10px 12px;
      }
      .tile .tl {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
      }
      .tile .tv {
        font-size: 20px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;

        border-color: var(--red-edge);

      }

        cursor: pointer;
        font-size: 20px;
        font-weight: 700;
        list-style: none;
        display: flex;
        justify-content: space-between;
        min-height: 44px;
        align-items: center;
      }

        display: none;
      }
      .details > summary::after {
        content: "+";
        color: var(--muted);
        font-size: 16px;
      }
      .details[open] > summary::after {
        content: "−";
      }
      .dgrid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px 32px;
        max-width: 72rem;
        padding-top: 8px;
      }
      @container res (min-width: 858px) {

          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .dgrid ul {

      }

        c.drivers.forEach((d) => (v -= (isCone(d) ? model(d).size * 0.12 : 0.4) * d.count));
        if (c.vent === "ported" && c.type === "box")
          v -= (c.port.count * Math.PI * (c.port.dia / 2) ** 2 * c.port.len * 0.016387) / 1.0;
        return Math.max(0, v);
      }
      const fillAllowed = (c) => !drawnTapped(c);
      const fillGain = (c) => (fillAllowed(c) ? FILL[c.fill].gain : 0);
      const actsAs = (c) => netL(c) * (1 + fillGain(c));
      function lowCorner(c, d) {
        if (c.type === "horn") return c.goals.low;
        const size = model(d).size || 6.5;
        const per = Math.max(2, actsAs(c) / d.count);
        let f = 52 * Math.pow(40 / per, 0.32) * Math.pow(12 / size, 0.35);
        return c.vent === "sealed" ? f : f * 0.78;
      }
      const filt = (flt, side, f) => {
        if (!flt) return 0;
        const r = side === "hp" ? flt.hz / f : f / flt.hz;
        switch (flt.type) {
          case "BW6":
            return -10 * Math.log10(1 + r ** 2);
          case "BW24":
            return -10 * Math.log10(1 + r ** 8);
          case "LR24":
            return -20 * Math.log10(1 + r ** 4);
          case "BW48":
            return -10 * Math.log10(1 + r ** 16);
          default:
            return -20 * Math.log10(1 + r ** 8);
        }
      };
      const roll = (fc, f, order, side) =>
        -10 * Math.log10(1 + (side === "hp" ? fc / f : f / fc) ** (2 * order));
      function driverResp(c, d, f) {
        const m = model(d);
        let L = m.sens + 6 * Math.log2(Math.max(1, d.count));
        if (d.type === "woofer" || d.type === "coaxial") {
          const lo = lowCorner(c, d);
          const order = c.type === "horn" || c.vent !== "sealed" ? 4 : 2;
          L += roll(lo, f, order, "hp") + roll(2600 * (10 / m.size), f, 2, "lp");
          if (c.type === "horn") {
            L += 6 * Math.exp(-(Math.log2(f / Math.sqrt(c.goals.low * c.goals.high)) ** 2) / 2);
            L += 2 * Math.sin(f / 9) * (f > c.goals.high ? 1 : 0.3);
            L += roll(c.goals.high * 1.6, f, 3, "lp");
          }
        } else if (d.type === "compression") {
          L += roll(550, f, 2, "hp") + roll(16000, f, 2, "lp") + (hornOf(d).w ? 0 : -6);
        } else {
          L += roll(900, f, 2, "hp") + roll(24000, f, 1, "lp");
        }
        return L;
      }
      const FREQS = Array.from({ length: 170 }, (_, i) => 15 * Math.pow(20000 / 15, i / 169));
      function bandCurves() {
        return S.bands.map((b) => {
          const users = [];
          S.chambers.forEach((c) =>
            c.drivers.forEach((d) => d.band === b.id && users.push([c, d])),
          );
          if (!users.length) return null;
          const resp = FREQS.map((f) => {
            const p = users.reduce((s, [c, d]) => s + 10 ** (driverResp(c, d, f) / 10), 0);
            return (
              10 * Math.log10(p) +
              b.level +
              filt(b.hp, "hp", f) +
              filt(b.lp, "lp", f) +
              filt(S.xover.hp, "hp", f) +
              filt(S.xover.lp, "lp", f)
            );
          });
          const cone = users.find(([, d]) => isCone(d));
          const fx = cone ? lowCorner(cone[0], cone[1]) * 1.5 : 0;
          const ceiling = 10 * Math.log10(b.amp) + (cone ? 0 : -3);
          const max = resp.map((L, i) => {
            const f = FREQS[i];
            let m = L + ceiling;
            if (cone && f < fx) {
              const hpLift = Math.max(0, -filt(b.hp, "hp", f) - filt(S.xover.hp, "hp", f));
              const limit = 128 + 6 * Math.log2(cone[1].count) - 40 * Math.log10(fx / f) + hpLift;
              m = Math.min(m, limit);
            }
            return m;
          });
          const pass = Math.max(...resp);
          return { b, resp, max, pass, peakMax: Math.max(...max), fx, users };
        });
      }
      const sumCurve = (curves, key) =>
        FREQS.map((_, i) => {
          const p = curves.reduce((s, c) => (c ? s + 10 ** (c[key][i] / 10) : s), 0);
          return p > 0 ? 10 * Math.log10(p) : -Infinity;
        });
      function fb(c) {
        if (c.type === "horn") return null;
        const cone = c.drivers.find(isCone);
        if (!cone) return null;
        return lowCorner(c, cone) * (c.vent === "sealed" ? 1 : 0.92);
      }
      function weightLb(c) {
        const area = (2 * (c.w * c.h + c.w * c.d + c.h * c.d)) / 144;
        const ply = PANELS.find((p) => p[0] === S.panel)[3];
        let lb = area * ply;
        if (c.type === "horn") lb += (((c.th18 ? 8 : 3) * (c.w * c.d)) / 144) * ply;
        else if (c.bracing !== "none") lb += area * ply * (c.bracing === "both" ? 0.18 : 0.1);
        c.drivers.forEach((d) => (lb += model(d).lb * d.count + (hornOf(d).w ? 3 : 0)));
        return lb + (S.hardware === "on" ? 4 : 0);
      }
      function priceUsd() {
        let p = S.hardware === "on" ? 120 : 0;
        S.chambers.forEach((c) => {
          c.drivers.forEach((d) => (p += (model(d).price + hornOf(d).price) * d.count));
          if (c.type === "box" && c.vent === "ported") p += 12 * c.port.count;
        });
        return p;
      }
      function braceText(c) {
        if (c.type === "horn") return "boards";
        return { ribs: "6 ribs", window: "2 windows", both: "2 + 4 ribs", none: "none" }[c.bracing];
      }

      /* ---------- control builders (as src/components/ui) ---------- */
      let uidN = 0;
      const uid = () => `f${++uidN}`;
      const term = (label, tip) =>
        tip ? `<span class="term" tabindex="0" data-tip="${esc(tip)}">${label}</span>` : label;
      function num(label, path, o = {}) {
        const id = uid();
        const v = getPath(path);
        return `<div class="field ${o.cls || ""}"><label class="lbl" for="${id}"><span>${term(label, o.tip)}</span>${o.extra || ""}</label><input id="${id}" type="number" inputmode="decimal" step="${o.step ?? 0.25}" ${o.min != null ? `min="${o.min}"` : ""} value="${esc(Math.round(v * 100) / 100)}" data-bind="${path}" ${o.pos ? `data-pos="${o.pos}"` : ""} ${o.rebuild ? "data-rebuild" : ""}></div>`;
      }
      function readonly(label, value, tip) {
        const id = uid();
        return `<div class="field"><label class="lbl" for="${id}"><span>${term(label, tip)}</span></label><input id="${id}" type="text" readonly value="${esc(value)}"></div>`;
      }
      function text(label, path) {
        const id = uid();
        return `<div class="field"><label class="lbl" for="${id}">${label}</label><input id="${id}" type="text" maxlength="60" value="${esc(getPath(path))}" data-bind="${path}"></div>`;
      }
      function sel(label, path, options, o = {}) {
        const id = uid();
        const v = o.value ?? getPath(path);
        const opt = ([val, name]) =>
          `<option value="${esc(val)}" ${String(val) === String(v) ? "selected" : ""}>${esc(name)}</option>`;
        const body = o.groups
          ? o.groups
              .map(
                ([g, list]) => `<optgroup label="${esc(g)}">${list.map(opt).join("")}</optgroup>`,
              )
              .join("")
          : options.map(opt).join("");
        const attr = o.filter ? `data-filter="${path}"` : `data-bind="${path}"`;
        return `<div class="field ${o.cls || ""}"><label class="lbl" for="${id}"><span>${term(label, o.tip)}</span>${o.extra || ""}</label><select id="${id}" ${attr} ${o.rebuild !== false ? "data-rebuild" : ""}>${body}</select></div>`;
      }
      function tg(label, path, options, o = {}) {
        const v = getPath(path);
        const btns = options
          .map(([val, name, tip]) => {
            const off = o.disabled && o.disabled.vals.includes(val);
            const t = off ? o.disabled.why : tip;
            return `<button type="button" class="btn" aria-pressed="${String(v) === String(val)}" data-set="${path}" data-val="${esc(val)}" ${off ? "disabled" : ""} ${t ? `data-tip="${esc(t)}"` : ""}>${name}</button>`;
          })
          .join("");
        return `<div class="field"><div class="lbl"><span>${term(label, o.tip)}</span>${o.extra || ""}</div><div class="tg" role="group" aria-label="${esc(o.aria || label.replace(/<[^>]+>/g, ""))}">${btns}</div>${o.after || ""}</div>`;
      }
      const ICON = {
        trash:
          '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.75 6.5v4.5M9.25 6.5v4.5"/></svg>',
        drivers:
          '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r=".6"/></svg>',
        cutaway:
          '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5l6-3 6 3v6l-6 3-6-3z"/><path d="M8 8v6M8 8l6-3M8 8 2 5" stroke-dasharray="2 1.6"/></svg>',
        chev: '<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>',
      };

      /* ---------- summaries ---------- */
      /* a band's pass range from its filters, e.g. "90 Hz–1.2 kHz" */
      const bandRange = (b) =>
        b.hp && b.lp
          ? `${hz(b.hp.hz)}–${hz(b.lp.hz)}`
          : b.hp
            ? `above ${hz(b.hp.hz)}`
            : b.lp
              ? `below ${hz(b.lp.hz)}`
              : "full range";
      const chamberSummary = (c) =>
        [
          c.type === "box"
            ? `${{ sealed: "Sealed", ported: "Ported", radiator: "Radiator" }[c.vent]} box`
            : `${HORN_TYPES.find((h) => h[0] === c.hornType)[1]} horn, ${c.path}`,
          `${fmt(c.w, 1)} × ${fmt(c.h, 1)} × ${fmt(c.d, 1)} in`,
          `${c.drivers.length} driver${c.drivers.length === 1 ? "" : "s"}`,
        ].join(", ");
      /* the summary lines of the boxes that fold */
      const driverSum = (c, d) => {
        const b = S.bands.find((x) => x.id === d.band);
        const top =
          c.type === "box" && d.mount === "top" && hornOf(d).w ? ` · ${hornOf(d).name} on top` : "";
        return `${d.count} × ${model(d).name}${top} · ${b ? b.name : "No"} band`;
      };
      const PORT_NAMES = { round: "round", slot: "slot", duct: "side ducts" };
      const ventSum = (c) =>
        c.vent === "sealed"
          ? "Sealed"
          : c.vent === "ported"
            ? `Ported · ${c.port.count} × ${+c.port.dia.toFixed(2)} in ${PORT_NAMES[c.port.shape]}, ${+c.port.len.toFixed(2)} in long`
            : `Passive radiator · ${c.port.count} × Dayton SD215A-88`;
      const FILL_SUM = {
        none: "No fill",
        lined: "Lined walls",
        half: "Half fill",
        full: "Full fill",
      };
      const BRACE_SUM = {
        ribs: "ribs",
        window: "window braces",
        both: "ribs and window braces",
      };
      const fillSum = (c) =>
        [
          FILL_SUM[c.fill],
          c.bracing === "none" ? "no braces" : `${BRACE_SUM[c.bracing]} to ${fmt(c.target)} Hz`,
          `${c.back} back`,
        ].join(" · ");
      const hornSetSum = (c) => {
        const name = HORN_TYPES.find((h) => h[0] === c.hornType)[1];
        const at = (n) => fmt(tapAt(c, n));
        if (c.hornType === "tapped")
          return `${name} · taps ${at(c.taps.front)} / ${at(c.taps.rear)} in`;
        if (c.hornType === "offset") return `${name} · tap ${at(c.taps.front)} in`;
        const n = hornSections(c).length;
        return `${name} · ${n} sections, ${at(n)} in long`;
      };
      const filterSum = (label, f) =>
        f ? `${label} ${f.type === "BW6" ? "6 dB/oct" : f.type} ${hz(f.hz)}` : `${label} off`;
      const bandSum = (b) =>
        [
          b.name,
          filterSum("High-pass", b.hp),
          filterSum("Low-pass", b.lp),
          b.level ? `${b.level > 0 ? "+" : "−"}${+Math.abs(b.level).toFixed(1)} dB` : null,
          `${fmt(b.amp)} W`,
        ]
          .filter(Boolean)
          .join(" · ");
      function summary(id) {
        const n = (k, a, b) => `${k} ${k === 1 ? a : b}`;
        switch (id) {
          case "construction":
            return [
              S.construction === "frame" ? "Frame" : "Flush",
              `${PANELS.find((p) => p[0] === S.panel)[2]} walls`,
              allBox() ? `${S.top} top` : null,
              S.hardware === "on" ? "hardware" : "no hardware",
            ]
              .filter(Boolean)
              .join(" · ");
          case "chambers":

          case "bands":
            return S.bands.map((b) => `${b.name} ${bandRange(b)}`).join(" · ");
          case "look":
            return `${FINISHES.find((f) => f[0] === view.finish)[1]} · baffle ${BAFFLES.find((f) => f[0] === view.baffle)[1].toLowerCase()}`;

        }
      }

      /* ---------- settings column ---------- */
      function section(id, title, body) {
        const open = folds[id];
        return `<section class="sec" data-sec="${id}"><h2><button type="button" data-fold="${id}" aria-expanded="${open}"><span class="ft"><span>${title}</span><span class="sum" data-sum="${id}" ${open ? "hidden" : ""}>${esc(summary(id))}</span></span><span class="pm" aria-hidden="true">${open ? "−" : "+"}</span></button></h2><div class="secbody stack" ${open ? "" : "hidden"}>${body}</div></section>`;
      }

      /* a box that folds to one summary line. o.title: a bold title, open and closed; o.sum: writes

      function foldBox(key, o, body) {
        const open = isBoxOpen(key);

        const sumHidden = o.title && open ? "hidden" : "";
        return `<div class="fbox" data-box="${key}"><div class="fhead"><button type="button" class="fsum" data-box-toggle="${key}" aria-expanded="${open}">${ICON.chev}<span class="ftext">${o.title ? `<span class="ftitle">${o.title}</span>` : ""}<span class="${o.title ? "fs" : "fs main"}" data-bsum ${sumHidden}>${esc(o.sum())}</span></span></button>${o.actions || ""}</div><div class="fbody stack" ${open ? "" : "hidden"}>${body}</div></div>`;
      }
      function setBox(key, open) {
        boxOpen[key] = open;
        const el = $(`[data-box="${key}"]`);
        if (!el) return;
        const btn = $(":scope > .fhead > .fsum", el);
        btn.setAttribute("aria-expanded", String(open));
        if ($(".ftitle", btn)) $("[data-bsum]", btn).hidden = open;
        $(":scope > .fbody", el).hidden = !open;
      }
      /* opens one driver's box and closes the other drivers' boxes in its chamber */
      /* where a driver id is: its chamber and driver indexes, or null */
      function driverAt(id) {
        for (let c = 0; c < S.chambers.length; c++) {
          const d = S.chambers[c].drivers.findIndex((x) => x.id === id);
          if (d >= 0) return { c, d };
        }
        return null;
      }
      function openDriver(c, d) {
        S.chambers[c].drivers.forEach((x, j) => setBox(`drv.${x.id}`, j === d));
      }
      const details = (key, sum, body, cls = "fold") =>
        `<details class="${cls}" data-key="${key}"><summary data-dsum="${key}">${sum}</summary><div class="stack">${body}</div></details>`;

      function constructionBody() {
        return `${tg("Construction", "construction", [
          ["frame", "Frame and inset baffle"],
          ["flush", "Flush box"],
        ])}
          ${S.construction === "frame" ? num("Baffle inset", "inset", { step: 0.125, tip: TIP.inset }) : ""}
          ${tg(
            "Wall panels",
            "panel",
            PANELS.map((p) => [p[0], p[1]]),
            { tip: TIP.panel },
          )}
          ${
            allBox()
              ? tg(
                  "Top",
                  "top",
                  [
                    ["flat", "Flat"],
                    ["arched", "Arched"],
                  ],
                  { tip: TIP.top },
                )
              : ""
          }
          ${tg(
            "Hardware",
            "hardware",
            [
              ["none", "None"],
              ["on", "Handles and input dish"],
            ],
            { tip: TIP.hardware },
          )}
          ${
            S.hardware === "on"
              ? sel(
                  "Handles",
                  "handles",
                  [
                    ["pa", "Penn Elcom recessed handle"],
                    ["bar", "Bar handle"],
                  ],
                  { value: "pa", rebuild: false },

              : ""

      }
      function fillField(c, i) {
        return tg(
          "Fiber fill",
          `chambers.${i}.fill`,
          Object.entries(FILL).map(([k, f]) => [k, f.name, f.what]),

            tip: TIP.fill,
            extra: `<span class="live" data-live="acts.${i}"></span>`,
          },

      }
      /* a chamber's sub-section: a small heading over a light inset box */
      const group = (title, body) =>
        `<div class="grp"><div class="subhead">${title}</div><div class="drvbox grpbody">${body}</div></div>`;
      function boxBody(c, i) {
        const p = `chambers.${i}`;

          ["sealed", "Sealed"],

            ["slot", "Slot"],

            <div class="r3">${num("Count", `${p}.port.count`, { step: 1, min: 1 })}${num("Diameter", `${p}.port.dia`)}${num("Length", `${p}.port.len`)}</div>`;

            "Passive radiator",
            `${p}.radiator`,
