        return (
          foldBox(`vent.${c.id}`, { title: "Vent", sum: () => ventSum(c) }, h) +
          foldBox(`fb.${c.id}`, { title: "Fill and bracing", sum: () => fillSum(c) }, fb)
        );
      }
      function hornBody(c, i) {
        const p = `chambers.${i}`;
        const sections = hornSections(c);
        const area = (v) => fmt(v, 1);
        let h = `<div class="field"><div class="lbl"><span>${term("Goals", TIP.goals)}</span><button type="button" class="btn primary xs nowrap" data-act="design" data-c="${i}" data-tip="${esc(TIP.design)}">Design from goals</button></div>
          <div class="goals">${num("Low, Hz", `${p}.goals.low`, { step: 1, tip: TIP.low })}${num("High, Hz", `${p}.goals.high`, { step: 1, tip: TIP.high })}${num("Level, dB", `${p}.goals.target`, { step: 1, tip: TIP.level })}</div></div>`;
        const goals = h;
        h = sel("Horn type", `${p}.hornType`, HORN_TYPES, { tip: TIP.hornType });
        const secs = sections.map((_, k) => [k + 1, `Section ${k + 1}`]);
        if (c.hornType === "tapped")
          h += `${sel("Front tap after section", `${p}.taps.front`, secs, { tip: TIP.taps })}${sel("Back tap after section", `${p}.taps.rear`, secs, { tip: TIP.taps })}`;
        if (c.hornType === "offset")
          h += sel("Tap after section", `${p}.taps.front`, secs, { tip: TIP.tap });
        h += `<div class="r2">${num("Compression ratio", `${p}.compression`, { step: 0.1, tip: TIP.compression })}${readonly("Front chamber, L", fmt(c.th18 ? 6.8 : 4.2, 1), TIP.frontChamber)}</div>`;
        if (c.path === "folded")
          h += tg(
            "Driver board",
            `${p}.board`,
            [
              ["wall", "Wall"],
              ["double", "Double"],
            ],
            { tip: TIP.board },
          );
        if (fillAllowed(c)) h += fillField(c, i);
        // the straight horn is calculated: read-only until "Edit by hand" is on
        const edit = !!view.shEdit[i];
        const off = edit ? "" : "disabled";
        // the line and the one "Edit by hand" toggle for what Design from goals or an import sets
        const editHead = `<div class="cardhead"><p class="hint">${TIP.shSet}</p><button type="button" class="btn xs nowrap" aria-pressed="${edit}" data-act="shEdit" data-c="${i}">Edit by hand</button></div>`;
        // a straight horn's rear chamber, under the same toggle; a folded horn has none (its drawing sets it)
        if (c.path === "straight") {
          const rid = uid();
          h += `${editHead}<div class="field"><label class="lbl" for="${rid}"><span>${term("Rear chamber, L", TIP.rearChamber)}</span></label><input id="${rid}" type="number" inputmode="decimal" step="0.5" min="0" value="${esc(Math.round(c.rearL * 10) / 10)}" data-bind="${p}.rearL" ${edit ? "" : "readonly"}></div>`;
        }
        const cols = "grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:6px";
        const rows = sections
          .map(
            ([prof, s1, s2, len], k) =>
              `<div class="r3 cmp" style="${cols}"><select aria-label="Section ${k + 1} profile" ${off}><option>${prof}</option><option>Conical</option><option>Exponential</option><option>Parabolic</option></select><input type="number" aria-label="Section ${k + 1} start area" value="${area(s1)}" ${off}><input type="number" aria-label="Section ${k + 1} end area" value="${area(s2)}" ${off}><input type="number" aria-label="Section ${k + 1} length" value="${fmt(len, 2)}" ${off}></div>`,
          )
          .join("");
        h += details(
          `sh.${i}`,
          `Straight horn · ${sections.length} sections, ${area(sections[0][1])} to ${area(sections[sections.length - 1][2])} in²`,
          `${c.path === "folded" ? `${editHead}<p class="hint">The path chart shows it dashed.</p>` : ""}
           <div class="r3 hint" style="${cols}"><span>Profile</span><span>${term("Start", TIP.secStart)}</span><span>${term("End", TIP.secEnd)}</span><span>Length</span></div>${rows}
           ${edit ? `<div><button type="button" class="btn primary xs" data-tip="${esc(TIP.placeholder)}">Add section</button></div>` : ""}`,
        );
        const iid = uid();
        h += details(
          `imp.${i}`,
          "Import a Hornresp record",
          `<div class="field"><label class="lbl" for="${iid}"><span>${term("Record text", TIP.importRec)}</span></label><textarea id="${iid}"></textarea></div>
           <div><button type="button" class="btn primary xs" data-act="import" data-c="${i}">Import</button></div>
           ${view.imported[i] ? '<p class="hint">Imported. The drivers stay as set in this chamber.</p>' : ""}`,
        );
        return (
          group("Horn", goals) +
          foldBox(`hs.${c.id}`, { title: "Horn settings", sum: () => hornSetSum(c) }, h)
        );
      }
      function driverBox(c, i, d, j) {
        const p = `chambers.${i}.drivers.${j}`;
        const list = MODELS[d.type].filter(
          (m) => d.type !== "woofer" || d.size === "all" || m.size === Number(d.size),
        );
        const models = (list.length ? list : MODELS[d.type]).map((m) => [m.id, m.name]);
        const hf = d.type === "compression" || d.type === "tweeter";
        const bandSel = sel(
          d.type === "coaxial" ? "Cone's band" : "Band",
          `${p}.band`,
          S.bands.map((b) => [b.id, b.name]),
          { tip: TIP.band },
        );
        let pos;
        if (c.type === "horn")
          pos = num("Left (−) / Right (+)", `${p}.x`, { pos: `${i}.${j}.x`, tip: TIP.hornX });
        else if (d.mount === "top")
          pos = `<div class="r2">${num("Left (−) / Right (+)", `${p}.x`, { pos: `${i}.${j}.x`, tip: TIP.x })}${num("Front (−) / Back (+)", `${p}.z`, { pos: `${i}.${j}.z`, tip: TIP.z })}</div>`;
        else
          pos = `<div class="r2">${num("Left (−) / Right (+)", `${p}.x`, { pos: `${i}.${j}.x`, tip: TIP.x })}${num("Down (−) / Up (+)", `${p}.y`, { pos: `${i}.${j}.y`, tip: TIP.y })}</div>`;
        const trash = `<button type="button" class="ibtn sm" data-act="delDriver" data-c="${i}" data-d="${j}" aria-label="Delete driver ${j + 1}" data-tip="${TIP.delDriver}">${ICON.trash}</button>`;
        return foldBox(
          `drv.${d.id}`,
          { sum: () => driverSum(c, d), actions: trash },
          `<div class="r2">${sel("Type", `${p}.type`, DRIVER_TYPES)}${d.type === "woofer" ? sel("Size", `${p}.size`, [["all", "All sizes"], ...SIZES.map((s) => [s, `${s} in`])]) : ""}</div>
          <div class="rmc">${sel("Model", `${p}.model`, models)}${num("Count", `${p}.count`, { step: 1, min: 1 })}</div>
          ${
            hf
              ? `<div class="r2">${sel(
                  "Horn or waveguide",
                  `${p}.horn`,
                  HORNS.map((h) => [h.id, h.name]),
                  { tip: TIP.horn },
                )}${
                  hornOf(d).w && c.type === "box"
                    ? sel(
                        "Mounting",
                        `${p}.mount`,
                        [
                          ["baffle", "In the baffle"],
                          ["top", "On top"],
                        ],
                        { tip: TIP.mount },
                      )
                    : ""
                }</div>`
              : ""
          }
          ${c.type === "horn" ? `<div class="r2">${bandSel}${pos}</div>` : `${bandSel}${pos}`}`,
        );
      }
      /* the Advanced fold's summary: the chamber's position (left or right of the cabinet's center, up from its bottom) */
      const advSummary = (c) => `Advanced · at ${+c.at.x.toFixed(2)}, ${+c.at.y.toFixed(2)}`;
      function chamberCard(c, i) {
        const p = `chambers.${i}`;
        const hasCone = c.drivers.some(isCone);
        const typeRow = `<div class="typerow">${tg(
          "Type",
          `${p}.type`,
          [
            ["box", "Box"],
            ["horn", "Horn"],
          ],
          { tip: TIP.load, disabled: hasCone ? null : { vals: ["horn"], why: TIP.loadNoCone } },
        )}${
          c.type === "horn"
            ? tg(
                "Path",
                `${p}.path`,
                [
                  ["straight", "Straight"],
                  ["folded", "Folded"],
                ],
                { tip: TIP.path },
              )
            : ""
        }</div>`;
        const adv = details(
          `adv.${i}`,
          advSummary(c),
          `<div class="r2">${num("Left (−) / Right (+)", `${p}.at.x`, { tip: TIP.chamberX })}${num("Down (−) / Up (+)", `${p}.at.y`, { tip: TIP.chamberY })}</div>`,
        );
        return `<div class="card" data-chamber="${i}">
          <div class="cardhead"><h3>Chamber ${i + 1}</h3>${S.chambers.length > 1 ? `<button type="button" class="btn xs" data-act="delChamber" data-c="${i}">Remove</button>` : ""}</div>
          ${group("Size", `${typeRow}<div class="r3">${num("Width", `${p}.w`)}${num("Height", `${p}.h`)}${num("Depth", `${p}.d`)}</div>${adv}`)}
          ${c.type === "box" ? boxBody(c, i) : hornBody(c, i)}
          <div class="grp"><div class="subhead">Drivers</div>
          ${c.drivers.length ? c.drivers.map((d, j) => driverBox(c, i, d, j)).join("") : '<p class="hint">No drivers yet.</p>'}
          <div><button type="button" class="btn primary" data-act="addDriver" data-c="${i}">Add driver</button></div></div>
        </div>`;
      }
      function filterRow(label, path) {
        const f = getPath(path);
        const options = [["", "Off"], ...FILTERS];
        if (!f) return sel(label, path, options, { value: "", filter: true, cls: "inline" });
        return `<div class="frow">${sel(label, path, options, { value: f.type, filter: true })}${num("Corner, Hz", `${path}.hz`, { step: 10, min: 10, tip: TIP.corner })}</div>`;
      }
      function bandsBody() {
        const xo = `<div class="card"><h3 style="font-size:16px">${term("External crossover", TIP.xover)}</h3>${filterRow("High-pass", "xover.hp")}${filterRow("Low-pass", "xover.lp")}</div>`;
        const bands = S.bands
          .map((b, k) =>
            foldBox(
              `band.${b.id}`,
              {
                sum: () => bandSum(b),
                actions:
                  S.bands.length > 1
                    ? `<button type="button" class="btn xs" data-act="delBand" data-b="${k}">Remove</button>`
                    : "",
              },
              `${text("Name", `bands.${k}.name`)}
            ${filterRow("High-pass", `bands.${k}.hp`)}
            ${filterRow("Low-pass", `bands.${k}.lp`)}
            <div class="r3">${num("Level, dB", `bands.${k}.level`, { step: 0.5, tip: TIP.bandLevel })}${sel(
              "Crossover",
              `bands.${k}.drive`,
              [
                ["active", "External"],
                ["passive", "Internal"],
              ],
              { tip: TIP.drive, rebuild: false },
            )}${num("Amp, W", `bands.${k}.amp`, { step: 50, tip: TIP.amp })}</div>`,
            ),
          )
          .join("");
        return `${xo}${bands}<div class="tg"><button type="button" class="btn primary" data-act="addBand">Add band</button><button type="button" class="btn" data-tip="${esc(TIP.placeholder)}">Balance levels</button></div>`;
      }
      function lookBody() {
        const sw = (list, key, label) =>
          `<div class="field"><div class="lbl">${label}</div><div class="tg">${list.map(([v, n, col]) => `<button type="button" class="btn xs" aria-pressed="${view[key] === v}" data-look="${key}" data-val="${v}"><i class="swatch" style="background:${col}"></i>${n}</button>`).join("")}</div></div>`;
        return `${sw(FINISHES, "finish", "Cabinet finish")}${sw(BAFFLES, "baffle", "Baffle color")}<p class="hint">Placeholder: no change from today.</p>`;
      }
      function optimizerBody() {
        return `<div class="startrow">${sel(
          "Goal",
          "optGoal",
          [
            ["out", "Most output"],
            ["flat", "Flattest response"],
            ["small", "Smallest box"],
          ],
          { value: "out", rebuild: false },
        )}<button type="button" class="btn primary" style="align-self:end" data-tip="${esc(TIP.placeholder)}">Optimize</button></div><p class="hint">Placeholder: no change from today.</p>`;
      }
      function renderSettings() {
        const active = document.activeElement;
        const key =
          active &&
          (active.dataset.bind ||
            active.dataset.filter ||
            (active.dataset.set ? active.dataset.set + "=" + active.dataset.val : null) ||
            active.dataset.act);
        boxSums.clear();
        const bodies = {
          construction: constructionBody,
          chambers: () =>
            S.chambers.map(chamberCard).join("") +
            '<div><button type="button" class="btn primary" data-act="addChamber">Add chamber</button></div>',
          bands: bandsBody,
          look: lookBody,
          optimizer: optimizerBody,
        };
        $("#settingsBody").innerHTML = SECTIONS.map(([id, t]) => section(id, t, bodies[id]())).join(
          "",
        );
        applyDetails($("#settingsBody"));
        if (key) {
          const el = $$(
            "#settingsBody [data-bind],#settingsBody [data-filter],#settingsBody [data-set],#settingsBody [data-act]",
          ).find(
            (e) =>
              (e.dataset.bind ||
                e.dataset.filter ||
                (e.dataset.set ? e.dataset.set + "=" + e.dataset.val : null) ||
                e.dataset.act) === key,
          );
          if (el) el.focus({ preventScroll: true });
        }
      }
      function applyDetails(root) {
        $$("details[data-key]", root).forEach((d) => {
          d.open = detailsOpen[d.dataset.key] ?? detailsDefault;
        });
      }
      function updateLive() {
        SECTIONS.forEach(([id]) => {
          const el = $(`[data-sum="${id}"]`);
          if (el) el.textContent = summary(id);
        });
        boxSums.forEach((write, key) => {
          const el = $(`[data-box="${key}"] > .fhead [data-bsum]`);
          if (el) el.textContent = write();
        });
        S.chambers.forEach((c, i) => {
          const a = $(`[data-live="acts.${i}"]`);
          if (a) {
            const g = fillGain(c);
            a.textContent = `Acts as ${fmt(actsAs(c), 0)} L${g ? ` (+${Math.round(g * 100)}%)` : ""}`;
          }
          const s = $(`[data-dsum="adv.${i}"]`);
          if (s) s.textContent = advSummary(c);
        });
      }

      /* ---------- results pane ---------- */
      /* the cabinet's left edge: chamber x is its center's offset from the cabinet's center line (0) */
      const cabLeft = () => Math.min(...S.chambers.map((c) => c.at.x - c.w / 2));
      /* a chamber's left edge in the drawings, from the cabinet's left edge */
      const leftOf = (c) => c.at.x - c.w / 2 - cabLeft();
      const cabBounds = () => {
        let W = 0,
          H = 0,
          D = 0;
        S.chambers.forEach((c) => {
          W = Math.max(W, leftOf(c) + c.w);
          H = Math.max(H, c.at.y + c.h);
          D = Math.max(D, c.d);
        });
        return { W, H, D };
      };
      const boardsOf = (c) =>
        c.path === "straight" ? STRAIGHT : c.th18 ? TH18_BOARDS : GENERIC_FOLD;
      /* where a horn chamber's cones sit in the side section (fractions), and which way they face */
      const hornDriverAt = (c) => {
        const [u0, v0, u1, v1] = boardsOf(c)[0];
        const t = 0.5;
        const len = Math.hypot(u1 - u0, v1 - v0);
        return {
          u: u0 + (u1 - u0) * t,
          v: v0 + (v1 - v0) * t,
          tu: (u1 - u0) / len,
          tv: (v1 - v0) / len,
        };
      };
      const archR = () => (S.top === "arched" && allBox() ? cabBounds().W / 2 : 0);

      function view3d() {
        const { W, H, D } = cabBounds();
        const kx = 0.5 * Math.cos(Math.PI / 6),
          ky = 0.5 * Math.sin(Math.PI / 6);
        const VW = 420,
          VH = 320;
        const tw = W + D * kx,
          th = H + archR() + D * ky;
        const s = Math.min((VW - 60) / tw, (VH - 50) / th);
        const ox = (VW - tw * s) / 2,
          oy = VH - (VH - th * s) / 2;
        const P = (x, y, z) => [ox + (x + z * kx) * s, oy - (y + z * ky) * s];
        const pts = (list) =>
          list
            .map((p) =>
              P(...p)
                .map((n) => n.toFixed(1))
                .join(","),
            )
            .join(" ");
        const poly = (list, fill, stroke = "#7d5f38", extra = "") =>
          `<polygon points="${pts(list)}" fill="${fill}" stroke="${stroke}" stroke-width="0.8" stroke-linejoin="round" ${extra}/>`;
        const t = panelIn();
        // data colors of the 3D view (PARTS_3D): the same in both themes
        const IN_BACK = "#ead7b1",
          IN_SIDE = "#dcc49b",
          IN_FLOOR = "#e3cda5",
          BRACE = "#b98f5a",
          CONE = "#1c1c1c",
          FIN = FINISHES.find((f) => f[0] === view.finish)[2],
          BAF = BAFFLES.find((f) => f[0] === view.baffle)[2];
        let g = "";
        // floor shadow
        const [fx0, fy0] = P(W / 2, 0, D / 2);
        g += `<ellipse cx="${fx0}" cy="${fy0 + 4}" rx="${(W * 0.62 + D * 0.3) * s}" ry="${D * 0.22 * s + 6}" fill="var(--shadow)" opacity="0.08"/>`;
        const driverCircles = (c, front) => {
          let out = "";
          const cx0 = leftOf(c) + c.w / 2;
          c.drivers.forEach((d) => {
            if (c.type === "horn") {
              const a = hornDriverAt(c);
              const z = t + a.u * (c.d - 2 * t),
                y = c.at.y + t + a.v * (c.h - 2 * t);
              const r = (model(d).size || 6) * 0.45 * s;
              const [px, py] = P(cx0 + d.x, y, z);
              out += `<ellipse cx="${px}" cy="${py}" rx="${r}" ry="${r * 0.42}" fill="${CONE}" stroke="#55585c" stroke-width="1"/><ellipse cx="${px}" cy="${py}" rx="${r * 0.35}" ry="${r * 0.15}" fill="#3a3c40"/>`;
              return;
            }
            if (d.mount === "top") {
              const h = hornOf(d);
              const y = c.at.y + c.h;
              out += poly(
                [
                  [cx0 + d.x - h.w / 2, y, d.z],
                  [cx0 + d.x + h.w / 2, y, d.z],
                  [cx0 + d.x + h.w / 2, y + h.h, d.z],
                  [cx0 + d.x - h.w / 2, y + h.h, d.z],
                ],
                "#3a3c40",
                "#1c1c1c",
              );
              return;
            }
            const n = d.count;
            const size = isCone(d) ? model(d).size : hornOf(d).w ? 0 : 4;
            for (let k = 0; k < n; k++) {
              const yy = c.at.y + d.y + (k - (n - 1) / 2) * (size || hornOf(d).h) * 1.05;
              const [px, py] = P(cx0 + d.x, yy, 0);
              if (!size) {
                const h = hornOf(d);
                out += front
                  ? `<rect x="${px - (h.w / 2) * s}" y="${py - (h.h / 2) * s}" width="${h.w * s}" height="${h.h * s}" rx="${h.h * 0.3 * s}" fill="#3a3c40" stroke="${CONE}"/><circle cx="${px}" cy="${py}" r="${1 * s}" fill="${CONE}"/>`
                  : "";
                continue;
              }
              const r = size * 0.47 * s;
              if (!front) {
                const [mx, my] = P(cx0 + d.x, yy, size * 0.45);
                out += `<line x1="${px}" y1="${py}" x2="${mx}" y2="${my}" stroke="#55585c" stroke-width="${r * 0.5}" stroke-linecap="round"/><circle cx="${mx}" cy="${my}" r="${r * 0.32}" fill="${CONE}"/>`;
              } else
                out += `<circle cx="${px}" cy="${py}" r="${r}" fill="${CONE}" stroke="#55585c" stroke-width="1.5"/><circle cx="${px}" cy="${py}" r="${r * 0.82}" fill="#2b2b2b"/><circle cx="${px}" cy="${py}" r="${r * 0.25}" fill="#3a3c40"/>`;
            }
          });
          return out;
        };
        const holes = (c) =>
          c.type === "horn"
            ? ""
            : c.drivers
                .filter((d) => d.mount !== "top")
                .map((d) => {
                  const cx0 = leftOf(c) + c.w / 2;
                  const size = isCone(d) ? model(d).size : hornOf(d).w ? 0 : 4;
                  let o = "";
                  for (let k = 0; k < d.count; k++) {
                    const yy =
                      c.at.y + d.y + (k - (d.count - 1) / 2) * (size || hornOf(d).h) * 1.05;
                    const [px, py] = P(cx0 + d.x, yy, 0);
                    o += size
                      ? `<circle cx="${px}" cy="${py}" r="${size * 0.42 * s}" fill="${IN_BACK}" stroke="#7d5f38"/>`
                      : `<rect x="${px - (hornOf(d).w / 2) * s}" y="${py - (hornOf(d).h / 2) * s}" width="${hornOf(d).w * s}" height="${hornOf(d).h * s}" rx="${hornOf(d).h * 0.3 * s}" fill="${IN_BACK}" stroke="#7d5f38"/>`;
                  }
                  return o;
                })
                .join("");
        const sorted = S.chambers.map((c, i) => [c, i]).sort((a, b) => a[0].at.y - b[0].at.y);
        sorted.forEach(([c]) => {
          const x0 = leftOf(c),
            x1 = x0 + c.w,
            y0 = c.at.y,
            y1 = y0 + c.h,
            d = c.d;
          const mouth = c.type === "horn" ? c.mouth.map((v) => y0 + t + v * (c.h - 2 * t)) : null;
          const front = (fill, op) => {
            if (!mouth)
              return poly(
                [
                  [x0, y0, 0],
                  [x1, y0, 0],
                  [x1, y1, 0],
                  [x0, y1, 0],
                ],
                fill,
                "#7d5f38",
                `fill-opacity="${op}"`,
              );
            return (
              poly(
                [
                  [x0, mouth[1], 0],
                  [x1, mouth[1], 0],
                  [x1, y1, 0],
                  [x0, y1, 0],
                ],
                fill,
                "#7d5f38",
                `fill-opacity="${op}"`,
              ) +
              (mouth[0] > y0
                ? poly(
                    [
                      [x0, y0, 0],
                      [x1, y0, 0],
                      [x1, mouth[0], 0],
                      [x0, mouth[0], 0],
                    ],
                    fill,
                    "#7d5f38",
                    `fill-opacity="${op}"`,
                  )
                : "")
            );
          };
          if (view.cutaway) {
            g += poly(
              [
                [x0 + t, y0 + t, d - t],
                [x1 - t, y0 + t, d - t],
                [x1 - t, y1 - t, d - t],
                [x0 + t, y1 - t, d - t],
              ],
              IN_BACK,
            );
            g += poly(
              [
                [x0 + t, y0 + t, t],
                [x0 + t, y0 + t, d - t],
                [x0 + t, y1 - t, d - t],
                [x0 + t, y1 - t, t],
              ],
              IN_SIDE,
            );
            g += poly(
              [
                [x0 + t, y0 + t, t],
                [x1 - t, y0 + t, t],
                [x1 - t, y0 + t, d - t],
                [x0 + t, y0 + t, d - t],
              ],
              IN_FLOOR,
            );
            if (c.type === "box") {
              if (c.bracing === "window" || c.bracing === "both") {
                const zb = d / 2,
                  m = Math.min(c.w, c.h) * 0.22;
                const outer = pts([
                  [x0 + t, y0 + t, zb],
                  [x1 - t, y0 + t, zb],
                  [x1 - t, y1 - t, zb],
                  [x0 + t, y1 - t, zb],
                ]);
                const inner = pts([
                  [x0 + m, y0 + m, zb],
                  [x0 + m, y1 - m, zb],
                  [x1 - m, y1 - m, zb],
                  [x1 - m, y0 + m, zb],
                ]);
                g += `<path d="M${outer.replace(/ /g, " L")}Z M${inner.replace(/ /g, " L")}Z" fill="${BRACE}" fill-rule="evenodd" stroke="#7d5f38" stroke-width="0.8"/>`;
              }
              if (c.bracing === "ribs" || c.bracing === "both")
                [0.33, 0.66].forEach((f) => {
                  const xr = x0 + t + f * (c.w - 2 * t);
                  g += poly(
                    [
                      [xr - 0.4, y0 + t, d - t],
                      [xr + 0.4, y0 + t, d - t],
                      [xr + 0.4, y1 - t, d - t],
                      [xr - 0.4, y1 - t, d - t],
                    ],
                    BRACE,
                  );
                });
              if (c.vent === "ported")
                for (let k = 0; k < c.port.count; k++) {
                  const r = c.port.dia / 2;
                  const pxx =
                    c.port.count > 1
                      ? x0 + c.w * (0.25 + 0.5 * (k / (c.port.count - 1)))
                      : x0 + c.w / 2;
                  const py = y0 + t + r + 1;
                  const [ax, ay] = P(pxx, py, 0),
                    [bx, by] = P(pxx, py, Math.min(c.port.len, d - 2 * t));
                  g += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#8a7458" stroke-width="${2 * r * s}" stroke-linecap="round" opacity="0.85"/>`;
                }
            } else {
              const bs = boardsOf(c)
                .map((b) => b)
                .sort((a, b) => Math.max(b[0], b[2]) - Math.max(a[0], a[2]));
              bs.forEach(([u0, v0, u1, v1]) => {
                const zA = t + u0 * (d - 2 * t),
                  yA = y0 + t + v0 * (c.h - 2 * t),
                  zB = t + u1 * (d - 2 * t),
                  yB = y0 + t + v1 * (c.h - 2 * t);
                g += poly(
                  [
                    [x0 + t, yA, zA],
                    [x1 - t, yA, zA],
                    [x1 - t, yB, zB],
                    [x0 + t, yB, zB],
                  ],
                  BRACE,
                  "#7d5f38",
                  'fill-opacity="0.92"',
                );
              });
            }
            if (view.drivers) g += driverCircles(c, false);
            g += front("#d7b98a", 0.3);
            if (!view.drivers) g += holes(c).replace(/fill="#ead7b1"/g, 'fill="none"');
            if (view.drivers) g += driverCircles(c, true);
            g += poly(
              [
                [x0, y1, 0],
                [x1, y1, 0],
                [x1, y1, d],
                [x0, y1, d],
              ],
              "#d7b98a",
              "#7d5f38",
              'fill-opacity="0.12" stroke-dasharray="4 3"',
            );
            g += poly(
              [
                [x1, y0, 0],
                [x1, y0, d],
                [x1, y1, d],
                [x1, y1, 0],
              ],
              "#d7b98a",
              "#7d5f38",
              'fill-opacity="0.12" stroke-dasharray="4 3"',
            );
          } else {
            g += front(S.construction === "frame" ? BAF : FIN, 1);
            if (mouth)
              g += poly(
                [
                  [x0 + t, mouth[0], 0.01],
                  [x1 - t, mouth[0], 0.01],
                  [x1 - t, mouth[1], 0.01],
                  [x0 + t, mouth[1], 0.01],
                ],
                IN_FLOOR,
              );
            if (S.construction === "frame") {
              g += poly(
                [
                  [x0, y0, 0],
                  [x0 + t, y0, 0],
                  [x0 + t, y1, 0],
                  [x0, y1, 0],
                ],
                FIN,
              );
              g += poly(
                [
                  [x1 - t, y0, 0],
                  [x1, y0, 0],
                  [x1, y1, 0],
                  [x1 - t, y1, 0],
                ],
                FIN,
              );
            }
            g += poly(
              [
                [x0, y1, 0],
                [x1, y1, 0],
                [x1, y1, d],
                [x0, y1, d],
              ],
              FIN,
              "#7d5f38",
              'style="filter:brightness(1.08)"',
            );
            g += poly(
              [
                [x1, y0, 0],
                [x1, y0, d],
                [x1, y1, d],
                [x1, y1, 0],
              ],
              FIN,
              "#7d5f38",
              'style="filter:brightness(0.88)"',
            );
            g += view.drivers ? driverCircles(c, true) : holes(c);
          }
        });
        return `<div class="v3d vh"><svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="3D view of the speaker${view.cutaway ? ", cut away" : ""}">${g}</svg>
          <div class="tools"><button type="button" class="ibtn" data-act="cutaway" aria-pressed="${view.cutaway}" aria-label="${TIP.cutaway}" data-tip="${TIP.cutaway}">${ICON.cutaway}</button>
          <button type="button" class="ibtn" data-act="drivers" aria-pressed="${view.drivers}" aria-label="${view.drivers ? TIP.hideDrivers : TIP.showDrivers}" data-tip="${view.drivers ? TIP.hideDrivers : TIP.showDrivers}">${ICON.drivers}</button></div></div>`;
      }

      function view2d() {
        return `<div class="card v2d vh"><div class="v2dhead"><div class="tg" role="group" aria-label="2D view">
          <button type="button" class="btn xs" data-act="v2d" data-val="front" aria-pressed="${view.v2d === "front"}">Front</button>
          <button type="button" class="btn xs" data-act="v2d" data-val="side" aria-pressed="${view.v2d === "side"}">Side</button></div>
          </div>
          <div class="svgwrap"><svg id="v2d" role="img" aria-label="2D view"></svg></div><p class="hint" id="v2dhint"></p></div>`;
      }
      let drag = null;
      function renderV2d() {
        const svg = $("#v2d");
        if (!svg) return;
        const { W, H, D } = cabBounds();
        const t = panelIn();
        const topExtra = Math.max(
          archR(),
          ...S.chambers.flatMap((c) =>
            c.drivers.filter((d) => d.mount === "top" && c.type === "box").map((d) => hornOf(d).h),
          ),
          0,
        );
        const Y = (y) => H - y;
        const lw = Math.max(W, D) / 260;
        const focus = view.focus;
        let g = `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 9 5 0 9z" fill="var(--cyan)"/></marker>
          <pattern id="hatch" width="1.2" height="1.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1.2" class="s-faint" stroke-width="0.25"/></pattern></defs>`;
        const mark = (x1, y1, x2, y2, label, hot) =>
          `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--cyan)" stroke-width="${hot ? lw * 2.2 : lw}" ${hot ? "" : 'stroke-dasharray="1 0.7"'} marker-end="url(#ar)"/>` +
          (label
            ? `<text x="${(x1 + x2) / 2 + (x1 === x2 ? lw * 6 : 0)}" y="${(y1 + y2) / 2 - (x1 === x2 ? 0 : lw * 6)}" font-size="${lw * 18}" fill="var(--cyan)" stroke="var(--panel)" stroke-width="${lw * 4}" paint-order="stroke" text-anchor="${x1 === x2 ? "start" : "middle"}" font-family="var(--font)" font-weight="700">${label} in</text>`
            : "");
        const ref = (x, y) =>
          `<circle cx="${x}" cy="${y}" r="${lw * 7}" fill="var(--page)" stroke="var(--cyan)" stroke-width="${lw * 2}"/><circle cx="${x}" cy="${y}" r="${lw * 2.5}" fill="var(--cyan)"/>`;
        if (view.v2d === "front") {
          $("#v2dhint").textContent = "Drag a driver to move it.";
          svg.setAttribute("viewBox", `${-2} ${-topExtra - 2} ${W + 4} ${H + topExtra + 4}`);
          S.chambers.forEach((c, i) => {
            const x0 = leftOf(c),
              yb = Y(c.at.y),
              yt = Y(c.at.y + c.h),
              cx0 = x0 + c.w / 2;
            g += `<rect x="${x0}" y="${yt}" width="${c.w}" height="${c.h}" fill="var(--panel)" class="s-ink" stroke-width="${lw * 1.5}"/>`;
            if (S.construction === "frame")
              g += `<rect x="${x0 + t}" y="${yt + t}" width="${c.w - 2 * t}" height="${c.h - 2 * t}" fill="none" class="s-faint" stroke-width="${lw}"/>`;
            if (c.type === "horn") {
              const [m0, m1] = c.mouth.map((v) => Y(c.at.y + t + v * (c.h - 2 * t)));
              g += `<rect x="${x0 + t}" y="${m1}" width="${c.w - 2 * t}" height="${m0 - m1}" fill="url(#hatch)" class="s-muted" stroke-width="${lw}"/>`;
              g += `<text x="${cx0}" y="${(m0 + m1) / 2}" font-size="${lw * 14}" fill="var(--muted)" text-anchor="middle" font-family="var(--font)">mouth</text>`;
            }
            if (c.type === "box" && c.vent === "ported")
              for (let k = 0; k < c.port.count; k++) {
                const px =
                  c.port.count > 1 ? x0 + c.w * (0.25 + 0.5 * (k / (c.port.count - 1))) : cx0;
                g += `<circle cx="${px}" cy="${Y(c.at.y + t + c.port.dia / 2 + 1)}" r="${c.port.dia / 2}" fill="none" class="s-muted" stroke-width="${lw * 1.2}"/>`;
              }
            c.drivers.forEach((d, j) => {
              const fz = focus && focus.c === i && focus.d === j ? focus : null;
              const dragging = drag && drag.c === i && drag.d === j;
              const col = isCone(d) ? "s-mag" : "s-cyan";
              const fill = isCone(d) ? "var(--magenta)" : "var(--cyan)";
              if (c.type === "horn") {
                const r = (model(d).size || 6) * 0.47;
                const a = hornDriverAt(c);
                const cy = Y(c.at.y + t + a.v * (c.h - 2 * t));
                g += `<circle cx="${cx0 + d.x}" cy="${cy}" r="${r}" fill="none" class="${col}" stroke-width="${lw * 1.4}" stroke-dasharray="${lw * 4} ${lw * 3}"/>`;
                if (fz)
                  g +=
                    `<line x1="${cx0}" x2="${cx0}" y1="${yt}" y2="${yb}" stroke="var(--cyan)" stroke-width="${lw}" stroke-dasharray="${lw * 4} ${lw * 3}"/>` +
                    ref(cx0, cy) +
                    mark(cx0, cy, cx0 + d.x, cy, signed(d.x), true);
                return;
              }
              let shape = "",
                gx = cx0 + d.x,
                gy = Y(c.at.y + d.y);
              if (d.mount === "top") {
                const h = hornOf(d);
                gy = Y(c.at.y + c.h) - h.h / 2;
                shape = `<rect x="${-h.w / 2}" y="${-h.h / 2}" width="${h.w}" height="${h.h}" rx="${h.h * 0.3}" fill="${fill}" fill-opacity="0.15" class="${col}" stroke-width="${lw * 1.6}"/>`;
              } else {
                const size = isCone(d) ? model(d).size : hornOf(d).w ? 0 : 4;
                for (let k = 0; k < d.count; k++) {
                  const oy = -(k - (d.count - 1) / 2) * (size || hornOf(d).h) * 1.05;
                  if (size)
                    shape += `<circle cx="0" cy="${oy}" r="${size * 0.47}" fill="${fill}" fill-opacity="0.12" class="${col}" stroke-width="${lw * 1.6}"/><circle cx="0" cy="${oy}" r="${size * 0.2}" fill="none" class="${col}" stroke-width="${lw}"/>`;
                  else {
                    const h = hornOf(d);
                    shape += `<rect x="${-h.w / 2}" y="${oy - h.h / 2}" width="${h.w}" height="${h.h}" rx="${h.h * 0.3}" fill="${fill}" fill-opacity="0.12" class="${col}" stroke-width="${lw * 1.6}"/><circle cx="0" cy="${oy}" r="0.8" fill="${fill}"/>`;
                  }
                }
              }
              g += `<g data-drv="${i}.${j}" transform="translate(${gx} ${gy})" tabindex="-1">${shape}<circle r="${lw * 1.5}" fill="var(--ink)"/></g>`;
              if (fz || dragging) {
                const axis = fz ? fz.axis : null;
                if (axis === "x")
                  g += `<line x1="${cx0}" x2="${cx0}" y1="${yt}" y2="${yb}" stroke="var(--cyan)" stroke-width="${lw}" stroke-dasharray="${lw * 4} ${lw * 3}"/>`;
                if (axis === "x" || dragging)
                  g += ref(cx0, gy) + mark(cx0, gy, gx, gy, signed(d.x), axis === "x");
                if ((axis === "y" || dragging) && d.mount !== "top")
                  g += ref(gx, yb) + mark(gx, yb, gx, gy, signed(d.y), axis === "y");
              }
            });
          });
          if (archR()) {
            const top = S.chambers.reduce((a, c) => (c.at.y + c.h > a.at.y + a.h ? c : a));
            const yt = Y(top.at.y + top.h);
            g += `<path d="M${leftOf(top)} ${yt} A ${top.w / 2} ${top.w / 2} 0 0 1 ${leftOf(top) + top.w} ${yt}" fill="var(--panel)" class="s-ink" stroke-width="${lw * 1.5}"/>`;
          }
        } else {
          $("#v2dhint").textContent = "Cut through the center. Front at the left.";
          const topExtraS = Math.max(
            0,
            ...S.chambers.flatMap((c) =>
              c.drivers
                .filter((d) => d.mount === "top" && c.type === "box")
                .map((d) => hornOf(d).h),
            ),
          );
          svg.setAttribute(
            "viewBox",
            `${-3} ${-topExtraS - archR() - 2} ${D + 6} ${H + topExtraS + archR() + 4}`,
          );
          S.chambers.forEach((c, i) => {
            const yb = Y(c.at.y),
              yt = Y(c.at.y + c.h);
            const X = (u) => t + u * (c.d - 2 * t);
            const YY = (v) => Y(c.at.y + t + v * (c.h - 2 * t));
            // walls
            g += `<rect x="0" y="${yt}" width="${c.d}" height="${c.h}" fill="var(--panel)" class="s-ink" stroke-width="${lw * 1.5}"/>`;
            g += `<rect x="${t}" y="${yt + t}" width="${c.d - 2 * t}" height="${c.h - 2 * t}" fill="var(--page)" class="s-muted" stroke-width="${lw}"/>`;
            if (c.type === "horn") {
              const [m0, m1] = c.mouth.map((v) => YY(v));
              g += `<rect x="${-lw}" y="${m1}" width="${t + 2 * lw}" height="${m0 - m1}" fill="var(--page)"/>`;
              g += `<text x="${-0.6}" y="${(m0 + m1) / 2}" font-size="${lw * 10}" fill="var(--muted)" text-anchor="end" font-family="var(--font)" transform="rotate(-90 ${-0.6} ${(m0 + m1) / 2})">mouth</text>`;
              boardsOf(c).forEach(([u0, v0, u1, v1]) => {
                g += `<line x1="${X(u0)}" y1="${YY(v0)}" x2="${X(u1)}" y2="${YY(v1)}" class="s-muted" stroke-width="${t}" stroke-linecap="square"/>`;
              });
              const a = hornDriverAt(c);
              const size = c.drivers.length ? model(c.drivers[0]).size || 12 : 0;
              if (size) {
                const px = X(a.u),
                  py = YY(a.v);
                // the board's direction in drawing units, and its normal (the side the cones face)
                let tx = a.tu * (c.d - 2 * t),
                  ty = -a.tv * (c.h - 2 * t);
                const L = Math.hypot(tx, ty);
                tx /= L;
                ty /= L;
                let nx = -ty,
                  ny = tx;
                if (c.path === "straight" ? nx > 0 : ny > 0) {
                  nx = -nx;
                  ny = -ny;
                }
                const r = size * 0.45,
                  dep = size * 0.4;
                const q = [
                  [px + tx * r, py + ty * r],
                  [px - tx * r, py - ty * r],
                  [px - tx * r * 0.3 - nx * dep, py - ty * r * 0.3 - ny * dep],
                  [px + tx * r * 0.3 - nx * dep, py + ty * r * 0.3 - ny * dep],
                ];
                g += `<polygon points="${q.map((p) => p.join(",")).join(" ")}" fill="var(--magenta)" fill-opacity="0.15" class="s-mag" stroke-width="${lw * 1.6}"/>`;
              }
              g += `<rect x="${X(0.02)}" y="${YY(0.95)}" width="${X(0.25) - X(0.02)}" height="${YY(0.62) - YY(0.95)}" fill="none" class="s-faint" stroke-width="${lw}" stroke-dasharray="${lw * 3} ${lw * 2}"/>`;
            } else {
              if (c.fill !== "none") {
                const f = c.fill;
                if (f === "lined")
                  g += `<path d="M${t} ${yt + t}h${c.d - 2 * t}v${c.h - 2 * t}h${-(c.d - 2 * t)}z M${t + 1} ${yt + t + 1}v${c.h - 2 * t - 2}h${c.d - 2 * t - 2}v${-(c.h - 2 * t - 2)}z" fill="url(#hatch)" fill-rule="evenodd"/>`;
                else
                  g += `<rect x="${t + 2}" y="${yt + t + (f === "half" ? (c.h - 2 * t) / 2 : 0)}" width="${c.d - 2 * t - 2}" height="${f === "half" ? (c.h - 2 * t) / 2 : c.h - 2 * t}" fill="url(#hatch)"/>`;
              }
              if (c.bracing === "window" || c.bracing === "both")
                g += `<rect x="${c.d / 2 - t / 2}" y="${yt + t}" width="${t}" height="${c.h - 2 * t}" fill="var(--faint)" opacity="0.5"/>`;
              if (c.vent === "ported") {
                const py = Y(c.at.y + t + c.port.dia / 2 + 1);
                g += `<rect x="0" y="${py - c.port.dia / 2}" width="${Math.min(c.port.len, c.d - 2 * t)}" height="${c.port.dia}" fill="none" class="s-muted" stroke-width="${lw * 1.2}"/>`;
              }
              c.drivers.forEach((d, j) => {
                const fz = focus && focus.c === i && focus.d === j && focus.axis === "z";
                const hf = !isCone(d);
                const col = hf ? "s-cyan" : "s-mag";
                const fill = hf ? "var(--cyan)" : "var(--magenta)";
                if (d.mount === "top") {
                  const h = hornOf(d);
                  const zc = d.z;
                  g += `<path d="M${zc - h.h * 0.9} ${yt - h.h / 2 - h.h / 2} L${zc + h.h} ${yt - h.h / 2 - h.h * 0.15} L${zc + h.h} ${yt - h.h / 2 + h.h * 0.15} L${zc - h.h * 0.9} ${yt} Z" fill="${fill}" fill-opacity="0.15" class="${col}" stroke-width="${lw * 1.6}"/>`;
                  if (fz)
                    g += ref(0, yt) + mark(0, yt - h.h / 2, zc, yt - h.h / 2, signed(d.z), true);
                  return;
                }
                const size = isCone(d) ? model(d).size : hornOf(d).h || 4;
                for (let k = 0; k < d.count; k++) {
                  const cy = Y(c.at.y + d.y) - (k - (d.count - 1) / 2) * size * 1.05;
                  const r = size * 0.45,
                    dep = isCone(d) ? size * 0.42 : hornOf(d).w ? 6 : 2;
                  g += `<polygon points="${t},${cy - r} ${t},${cy + r} ${t + dep},${cy + r * 0.3} ${t + dep},${cy - r * 0.3}" fill="${fill}" fill-opacity="0.15" class="${col}" stroke-width="${lw * 1.6}"/>`;
                  if (isCone(d))
                    g += `<rect x="${t + dep}" y="${cy - r * 0.35}" width="${size * 0.2}" height="${r * 0.7}" fill="${fill}" fill-opacity="0.3" class="${col}" stroke-width="${lw}"/>`;
                }
              });
            }
          });
        }
        svg.innerHTML = g;
      }

      function foldCard(c, i) {
        const VW = 300,
          VH = 300,
          m = 14;
        const s = Math.min((VW - 2 * m) / c.d, (VH - 2 * m) / c.h);
        const X = (u) => m + u * c.d * s,
          Y = (v) => VH - m - v * c.h * s;
        let ed = `<rect x="${m}" y="${VH - m - c.h * s}" width="${c.d * s}" height="${c.h * s}" fill="var(--panel)" class="s-ink" stroke-width="1.5"/>`;
        boardsOf(c).forEach(([u0, v0, u1, v1]) => {
          ed += `<line x1="${X(u0)}" y1="${Y(v0)}" x2="${X(u1)}" y2="${Y(v1)}" class="s-muted" stroke-width="${0.75 * s}" stroke-linecap="square"/>`;
          ed += `<circle cx="${X(u0)}" cy="${Y(v0)}" r="4" fill="var(--panel)" class="s-cyan" stroke-width="1.5"/><circle cx="${X(u1)}" cy="${Y(v1)}" r="4" fill="var(--panel)" class="s-cyan" stroke-width="1.5"/>`;
        });
        const a = hornDriverAt(c);
        ed += `<circle cx="${X(a.u)}" cy="${Y(a.v)}" r="${(model(c.drivers[0] || { type: "woofer", model: "pd1850" }).size || 12) * 0.2 * s}" fill="var(--magenta)" fill-opacity="0.2" class="s-mag" stroke-width="1.5"/>`;
        // path chart: area along the path, with the straight horn dashed (scaled to the drawing: owner-approved exception)
        const secs = hornSections(c);
        const total = secs.reduce((sum, x) => sum + x[3], 0);
        const amax = Math.max(...secs.map((x) => x[2])) * 1.15;
        const CW = 300,
          CH = 300,
          L = 40,
          B = 28;
        const cx = (l) => L + (l / total) * (CW - L - 10),
          cy = (A) => CH - B - (A / amax) * (CH - B - 10);
        let acc = 0,
          dashed = "",
          drawn = "";
        secs.forEach(([, s1, s2, len], k) => {
          dashed += `${k ? "L" : "M"}${cx(acc)} ${cy(s1)} L${cx(acc + len)} ${cy(s2)} `;
          const wob = (z) => z * (1 + 0.06 * Math.sin(k * 2 + 1));
          drawn += `${k ? "L" : "M"}${cx(acc)} ${cy(wob(s1))} L${cx(acc + len)} ${cy(wob(s2))} `;
          acc += len;
        });
        let ch = `<line x1="${L}" y1="${CH - B}" x2="${CW - 10}" y2="${CH - B}" class="s-edge"/><line x1="${L}" y1="10" x2="${L}" y2="${CH - B}" class="s-edge"/>`;
        ch += `<path d="${dashed}" fill="none" class="s-faint" stroke-width="2" stroke-dasharray="6 4"/><path d="${drawn}" fill="none" class="s-cyan" stroke-width="2.5"/>`;
        ch += `<text x="${L}" y="${CH - 8}">0</text><text x="${CW - 10}" y="${CH - 8}" text-anchor="end">${fmt(total)} in along the path</text><text x="${L - 4}" y="18" text-anchor="end">${fmt(amax)}</text><text x="${L - 4}" y="${CH - B}" text-anchor="end">in²</text>`;
        return `<section class="card block"><div class="cardhead"><h2 class="sh" style="font-size:16px">Folded horn${S.chambers.length > 1 ? ` ${i + 1}` : ""}<span class="tag">static placeholder</span></h2>
          <span class="tg"><button type="button" class="btn xs" aria-pressed="true" data-tip="${esc(TIP.placeholder)}">Move</button><button type="button" class="btn xs" data-tip="${esc(TIP.placeholder)}">Add board</button><button type="button" class="btn xs" data-tip="${esc(TIP.placeholder)}">Place drivers</button><button type="button" class="btn xs" data-tip="${esc(TIP.placeholder)}">Set mouth</button></span></div>
          <div class="foldgrid"><svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Folded horn editor">${ed}</svg><svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="Path chart">${ch}</svg></div></section>`;
      }

      /* the Response and Maximum output charts' drawn width: the results pane's width, one or two columns */
      function chartWidth() {
        const w = $("#resultsInner").clientWidth || 520;
        return Math.max(240, Math.round(w >= 858 ? (w - 16) / 2 : w));
      }
      function chart(top, bot, series, marks, ylabel) {
        const W = chartWidth(),
          H = 280,
          L = 40,
          R = 10,
          T = 10,
          B = 34;
        const fx = (f) => L + (Math.log10(f / 15) / Math.log10(20000 / 15)) * (W - L - R);
        const fy = (db) => T + ((top - db) / (top - bot)) * (H - T - B);
        let g = "";
        for (let db = bot; db <= top; db += 10)
          g += `<line x1="${L}" x2="${W - R}" y1="${fy(db)}" y2="${fy(db)}" class="s-edge"/><text x="${L - 6}" y="${fy(db) + 4}" text-anchor="end">${db}</text>`;
        [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000].forEach((f) => {
          g += `<line y1="${T}" y2="${H - B}" x1="${fx(f)}" x2="${fx(f)}" class="s-edge"/><text x="${fx(f)}" y="${H - B + 16}" text-anchor="middle">${f >= 1000 ? f / 1000 + "k" : f}</text>`;
        });
        g += `<text x="${W - R}" y="${H - 4}" text-anchor="end">Hz</text><text x="${L}" y="${H - 4}">${ylabel}</text>`;
        marks.forEach((m) => {
          g += `<line y1="${T}" y2="${H - B}" x1="${fx(m.f)}" x2="${fx(m.f)}" class="s-muted" stroke-dasharray="3 3"/><text x="${fx(m.f) + 3}" y="${T + 12}">${m.label}</text>`;
        });
        series.forEach((sr) => {
          let d = "",
            pen = false;

        const unbraced = S.chambers.some((c) => c.type === "box" && c.bracing === "none");
        const det = [

      /* the dispersion map's scale (DISPERSION_SCALE: an owner-approved exception to the palette) */
      const DSTOPS = [
        [6, "#ffffff"],
        [3, "#ff8fa3"],
        [0, "#ff1a00"],
        [-4, "#ff9900"],
        [-7, "#ffee00"],
        [-10, "#a8ff00"],
        [-14, "#00e040"],
        [-17, "#00ffd0"],
        [-20, "#00b0ff"],
        [-24, "#2040ff"],
        [-27, "#8000ff"],
        [-30, "#d000d0"],
        [-33, "#500050"],
        [-36, "#000000"],
      ];
      function dcol(db) {
        db = clamp(db, -36, 6);
        for (let i = 0; i < DSTOPS.length - 1; i++) {
          const [d0, c0] = DSTOPS[i],
            [d1, c1] = DSTOPS[i + 1];
          if (db <= d0 && db >= d1) {
            const t = (d0 - db) / (d0 - d1);
            const a = parseInt(c0.slice(1), 16),
              b = parseInt(c1.slice(1), 16);
            const mix = (sh) =>
              Math.round(((a >> sh) & 255) + (((b >> sh) & 255) - ((a >> sh) & 255)) * t);
            return `rgb(${mix(16)},${mix(8)},${mix(0)})`;
          }
        }
        return "#000";
      }
      function dispersion() {
        const W = 520,
          H = 240,
          L = 40,
          B = 26,
          cols = 48,
          rows = 24;
        let g = "";
        const cw = (W - L - 10) / cols,
          rh = (H - B - 6) / rows;
        for (let i = 0; i < cols; i++) {
          const f = 50 * Math.pow(400, (i + 0.5) / cols);
          const k = 2 + 34 * clamp(Math.log10(f / 150) / 2, 0, 1);
          for (let j = 0; j < rows; j++) {
            const ang = -90 + (180 * (j + 0.5)) / rows;
            g += `<rect x="${(L + i * cw).toFixed(1)}" y="${(6 + j * rh).toFixed(1)}" width="${(cw + 0.5).toFixed(1)}" height="${(rh + 0.5).toFixed(1)}" fill="${dcol(-k * (ang / 90) ** 2)}"/>`;
          }
        }
        [50, 100, 1000, 10000, 20000].forEach((f) => {
          const x = L + (Math.log10(f / 50) / Math.log10(400)) * (W - L - 10);
          g += `<text x="${x}" y="${H - 8}" text-anchor="middle">${f >= 1000 ? f / 1000 + "k" : f}</text>`;
        });
        g += `<text x="${L - 6}" y="14" text-anchor="end">−90°</text><text x="${L - 6}" y="${(H - B) / 2 + 6}" text-anchor="end">0°</text><text x="${L - 6}" y="${H - B}" text-anchor="end">90°</text>`;
        return `<div class="chart disp"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dispersion map">${g}</svg></div>`;
      }

      /* ---------- actions ---------- */
      function changed(rebuild) {
        if (rebuild) renderSettings();
        renderResults();
        updateLive();
        measure();
      }
      function afterSet(path, val) {
        let m;
        if ((m = path.match(/^chambers\.(\d+)\.drivers\.(\d+)\.type$/))) {
          const d = S.chambers[+m[1]].drivers[+m[2]];
          const first = {
            woofer: "12ndl",
            compression: "de250",
            tweeter: "sb26",
            coaxial: "12cxn",
          }[val];
          Object.assign(
            d,
            driver(val, first, { id: d.id, band: d.band, x: d.x, y: d.y, count: 1 }),
          );
        } else if ((m = path.match(/^chambers\.(\d+)\.drivers\.(\d+)\.size$/))) {
          const d = S.chambers[+m[1]].drivers[+m[2]];
          if (val !== "all") {
            const fit = MODELS.woofer.find((x) => x.size === Number(val));
            if (fit) d.model = fit.id;
          }
        } else if ((m = path.match(/^chambers\.(\d+)\.drivers\.(\d+)\.horn$/))) {
          if (val === "none") S.chambers[+m[1]].drivers[+m[2]].mount = "baffle";
        } else if ((m = path.match(/^chambers\.(\d+)\.type$/))) {
          const c = S.chambers[+m[1]];
          if (val === "horn") c.drivers.forEach((d) => (d.mount = "baffle"));
        }
      }
      document.addEventListener("click", (e) => {
        const f = e.target.closest("[data-fold]");
        if (f) {
          setFold(f.dataset.fold, !folds[f.dataset.fold]);
          measure();
          return;
        }
        const bt = e.target.closest("[data-box-toggle]");
        if (bt) {
          const key = bt.dataset.boxToggle;
          const open = !isBoxOpen(key);
          const at = key.startsWith("drv.") ? driverAt(key.slice(4)) : null;
          if (at && open) openDriver(at.c, at.d);
          else setBox(key, open);

        }
        const set = e.target.closest("[data-set]");
        if (set && !set.disabled) {
          const old = getPath(set.dataset.set);

            const top = Math.max(0, ...S.chambers.map((x) => x.at.y + x.h));

            changed(false);
            return;
          case "cutaway":
            view.cutaway = !view.cutaway;
            changed(false);
            return;
          case "v2d":
            view.v2d = a.dataset.val;
            renderResults();
            measure();
            return;

            return;
        }

      });

      function setFold(id, open) {

      /* drag a driver in the Front view */
      const svgPoint = (svg, e) => {
        const pt = svg.createSVGPoint();
        pt.x = e.clientX;

        return pt.matrixTransform(svg.getScreenCTM().inverse());
      };
      document.addEventListener("pointerdown", (e) => {
        const g = e.target.closest && e.target.closest("[data-drv]");
        if (!g) return;
        const svg = $("#v2d");
        const [c, d] = g.dataset.drv.split(".").map(Number);
        drag = { c, d, id: e.pointerId };
        // dragging a driver opens its box in the settings
        setFold("chambers", true);
        openDriver(c, d);
        const box = $(`[data-box="drv.${S.chambers[c].drivers[d].id}"]`);
        if (box && window.innerWidth >= 768) box.scrollIntoView({ block: "nearest" });
        measure();
        svg.setPointerCapture(e.pointerId);
        svg.classList.add("dragging");
        e.preventDefault();
        renderV2d();
      });
      document.addEventListener("pointermove", (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        const svg = $("#v2d");
        const p = svgPoint(svg, e);
        const { H } = cabBounds();
        const c = S.chambers[drag.c],
          d = c.drivers[drag.d];
        const r = isCone(d) ? model(d).size * 0.47 : (hornOf(d).w || 4) / 2;
        const rh = isCone(d)
          ? r * (1 + (d.count - 1) * 1.05)
          : ((hornOf(d).h || 4) / 2) * (1 + (d.count - 1) * 1.05 * 2);
        d.x = q4(clamp(p.x - (leftOf(c) + c.w / 2), -c.w / 2 + r, c.w / 2 - r));
        if (d.mount !== "top") d.y = q4(clamp(H - p.y - c.at.y, rh, c.h - rh));
        const base = `chambers.${drag.c}.drivers.${drag.d}`;
        const fx = $(`[data-bind="${base}.x"]`),
          fy = $(`[data-bind="${base}.y"]`);
        if (fx) fx.value = d.x;
        if (fy) fy.value = d.y;
        renderV2d();
      });
      const endDrag = (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        drag = null;
        $("#v2d").classList.remove("dragging");
        renderResults();
        updateLive();
      };
      document.addEventListener("pointerup", endDrag);
      document.addEventListener("pointercancel", endDrag);

      /* tooltips: hover, keyboard focus or tap; Esc closes */
      const tipEl = $("#tip");
      let tipFor = null;
      function showTip(el) {
        tipFor = el;
        tipEl.textContent = el.dataset.tip;
        tipEl.hidden = false;
        const r = el.getBoundingClientRect();
        const w = tipEl.offsetWidth;
        tipEl.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - w - 8))}px`;
        const below = r.bottom + 4;
        tipEl.style.top = `${below + tipEl.offsetHeight > window.innerHeight - 8 ? r.top - tipEl.offsetHeight - 4 : below}px`;
      }
      function hideTip() {
        tipFor = null;
        tipEl.hidden = true;
      }
      document.addEventListener("pointerover", (e) => {
        const el = e.target.closest && e.target.closest("[data-tip]");
        if (el && e.pointerType !== "touch") showTip(el);
      });
      document.addEventListener("pointerout", (e) => {
        const el = e.target.closest && e.target.closest("[data-tip]");
        if (el && el === tipFor && !el.contains(e.relatedTarget)) hideTip();
      });
      document.addEventListener("focusin", (e) => {
        if (e.target.dataset && e.target.dataset.tip) showTip(e.target);
      });
      document.addEventListener("focusout", (e) => {
        if (e.target === tipFor) hideTip();
      });
      document.addEventListener("pointerup", (e) => {
        if (e.pointerType !== "touch") return;
        const el = e.target.closest && e.target.closest(".term,.chip");
        if (el) (tipFor === el ? hideTip : showTip)(el);
        else hideTip();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") hideTip();
      });
      $$(".pane").forEach((p) => p.addEventListener("scroll", hideTip, { passive: true }));

      /* theme */
      function setTheme(t) {
        if (t === "system") document.documentElement.removeAttribute("data-theme");
        else document.documentElement.setAttribute("data-theme", t);
        $$("[data-theme-set]").forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.themeSet === t)),
        );
        store.set("speakerMock.theme", t);
      }

      /* the plan's tasks and the panes' heights */
      const TASKS = [
        [
          "Open TH18: less scrolling",
          "Open the TH18 template. See the whole design with less scrolling than today.",
        ],
        [
          "3D: show/hide drivers",
          "Show and hide the drivers in the 3D view. The interior is not black.",
        ],
        ["2D: Front / Side", "Switch the 2D view between Front and Side."],
        ["Details: what Response includes", "Find what the response chart includes, in Details."],
        [
          "Box → Horn",
          "Change a chamber from Box to Horn. Bracing and back panel go away; the horn settings come.",
        ],
        ["Fiber fill", "Set fiber fill. Read what each choice does in its tooltip."],
        ["High-pass and low-pass", "Set a band's highpass and lowpass without long button rows."],
        ["Add a driver, delete it", "Add a second driver, then delete it with its trash icon."],
        [
          "Drag a driver",
          "Move a driver on the baffle by dragging it in the Front view. Read its position in the fields.",
        ],
      ];
      const ticked = store.get("speakerMock.tasks", []);
      $("#tasks").innerHTML = TASKS.map(
        ([s, full], i) =>
          `<li class="${ticked.includes(i) ? "done" : ""}"><label title="${esc(full)}"><input type="checkbox" data-task="${i}" ${ticked.includes(i) ? "checked" : ""}><span>${i + 1}. ${esc(s)}</span></label></li>`,
      ).join("");
      $("#tasks").addEventListener("change", (e) => {
        const i = +e.target.dataset.task;
        const at = ticked.indexOf(i);
        if (e.target.checked && at < 0) ticked.push(i);
        if (!e.target.checked && at >= 0) ticked.splice(at, 1);
        e.target.closest("li").classList.toggle("done", e.target.checked);
        store.set("speakerMock.tasks", ticked);
      });
      let measureQueued = false;
      function measure() {
        if (measureQueued) return;
        measureQueued = true;
        requestAnimationFrame(() => {
          measureQueued = false;
          const r = $("#results").scrollHeight;
          const s = $(".sethead").offsetHeight + $("#settingsBody").scrollHeight;
          const fmtPx = (v, today) =>
            `<b class="${v < today ? "ok" : ""}">${fmt(v)} px</b> <span class="hint">(today ~${fmt(today)})</span>`;
          $("#readout").innerHTML = `Results ${fmtPx(r, 2700)} · Settings ${fmtPx(s, 3900)}`;
          window.paneHeights = { results: r, settings: s };
        });
      }
      // the fixed-height charts are drawn to the pane's width: redraw them when it changes
      let lastResW = 0;
      window.addEventListener("resize", () => {
        const w = $("#resultsInner").clientWidth;
        if (w !== lastResW) {
          lastResW = w;
          renderResults();
        }
        measure();
      });

      /* start */
      setTheme(store.get("speakerMock.theme", "system"));
      load("paMid");
      renderSettings();
      renderResults();
      updateLive();
      measure();
    </script>
  </body>
</html>
